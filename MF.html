      bericht.neu += abgelegt.neu;
      bericht.ersetzt += abgelegt.ersetzt;
      ergebnis.paket = paketeVereinen(ergebnis.paket, abgelegt.neuPaket);
      return true;
    };

    for (let a = von; a < jetzt; ) {
      const e = Math.min(a + v.fensterMs, jetzt);
      nr += 1;
      meldung({ typ, art: mfArt, nr, von: nrGesamt, gelesen: bericht.neu + bericht.ersetzt, phase: "lesen" });
      try {
        const gut = await fenster(a, e);
        serie = gut ? 0 : serie + 1;
        // Stand: bis zum Ende dieses Fensters, aber nie hinter die erste Lücke (die liest der nächste Lauf noch einmal)
        bericht.bisMs = ersteLuecke ?? e;
        await speicher.schreib(SYNC_PRAEFIX + typ, { bisMs: bericht.bisMs, zeitpunktMs: jetzt, anzahl: bericht.gelesen });
        if (serie >= v.luckenSerieMax) { bericht.fehler = `${bericht.fehler || "Lesefehler"} (abgebrochen nach ${serie} Lücken hintereinander)`; break; }
      } catch (fehler) {
        bericht.fehler = text(fehler);
        break;
      }
      a = e;
    }
    ergebnis.neu += bericht.neu;
    ergebnis.ersetzt += bericht.ersetzt;
    if (bericht.neu + bericht.ersetzt > 0) ergebnis.zaehlung[mfArt] = (ergebnis.zaehlung[mfArt] || 0) + bericht.neu + bericht.ersetzt;
    if (bericht.vonTag !== undefined) {
      if (!ergebnis.zeitraum) ergebnis.zeitraum = { von: bericht.vonTag, bis: bericht.bisTag };
      else {
        if (bericht.vonTag < ergebnis.zeitraum.von) ergebnis.zeitraum.von = bericht.vonTag;
        if (bericht.bisTag > ergebnis.zeitraum.bis) ergebnis.zeitraum.bis = bericht.bisTag;
      }
    }
    if (bericht.fehler) ergebnis.fehler.push(`${typ}: ${bericht.fehler}`);
  }
  return ergebnis;
}

/** Herzschläge für die Zeiträume der Trainings holen. Ohne Herzschlag-Recht: Training ohne Kurve. */
async function herzschlaegeFuer(bruecke, sitzungen) {
  const herzschlaege = [];
  for (const s of sitzungen) {
    const von = zeitMs(s.startTime);
    const bis = zeitMs(s.endTime);
    if (von === null || bis === null || bis <= von) continue;
    try {
      herzschlaege.push(...herzschlaegeAus((await bruecke.lesen("HeartRate", von, bis)) || []));
    } catch {
      return { herzschlaege: [] };
    }
  }
  return { herzschlaege };
}
return { RECORD_TYPEN, ART_ZU_PAKET, SCHLAFSTUFEN, TRAININGSARTEN, VORGABEN, mitZeitgrenze, SYNC_PRAEFIX, herzschlaegeAus, hauttempAus, schlafAus, hatSchlafphasen, quellenAnzeige, trainingAus, zuordnen, findeBruecke, verfuegbar, berechtigungen, synchronisieren };
})();

// Brücke Capacitor-Plugin → `window.MF.native.healthConnect`.

/**
 * Plugin-Objekt von Capacitor holen, oder null (Browser, Tests).
 * Ohne gebündeltes @capacitor/core legt die native Brücke (native-bridge.js, Capacitor 6) selbst `Capacitor.Plugins.HealthConnect`

  if (typeof cap.isNativePlatform === "function" && !cap.isNativePlatform()) return null;

/**

function installiereBruecke(ziel = globalThis) {
  const p = plugin(ziel);

    berechtigungen: (arten) => p.berechtigungen({ arten }),

      const r = await p.lesen({ art, vonMs: Math.round(vonMs), bisMs: Math.round(bisMs) });

    einstellungen: () => p.einstellungen(),

/** Trennzeichen raten: Komma (WHOOP) oder Semikolon (in deutschem Excel neu gespeichert) oder Tab. */
function rateTrenner(text) {
  const zaehl = { ",": 0, ";": 0, "\t": 0 };
  let inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (c === '"') inQ = !inQ;
    else if (!inQ && (c === "\n" || c === "\r")) break;
    else if (!inQ && c in zaehl) zaehl[c] += 1;
  }
  if (zaehl[";"] > zaehl[","] && zaehl[";"] >= zaehl["\t"]) return ";";
  if (zaehl["\t"] > zaehl[","]) return "\t";
  return ",";
}

/**
 * CSV-Text zerlegen (RFC 4180): Anführungszeichen, verdoppelte "" im Feld, Zeilenumbrüche im Feld,
 * CRLF/LF/CR, BOM. Leere Zeilen werden übersprungen.
 * @returns {{ kopf: string[], zeilen: {zeile:number, werte:string[]}[], trenner: string }}
 *   `zeile` = physische Zeilennummer (1 = Kopf), an der der Datensatz beginnt.
 */
function parseCsv(text, trenner) {
  let s = String(text ?? "");
  if (s.charCodeAt(0) === 0xfeff) s = s.slice(1);
  const t = trenner || rateTrenner(s);
  const saetze = [];
  let feld = "";
  let satz = [];
  let inQ = false;
  let zeile = 1;
  let start = 1;
  let feldAngefangen = false;
  const satzEnde = () => {
    satz.push(feld);
    if (!(satz.length === 1 && satz[0] === "" && !feldAngefangen)) saetze.push({ zeile: start, werte: satz });
    satz = [];
    feld = "";
    feldAngefangen = false;
  };
  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    if (inQ) {
      if (c === '"') {
        if (s[i + 1] === '"') { feld += '"'; i++; } else inQ = false;
      } else {
        if (c === "\n" || (c === "\r" && s[i + 1] !== "\n")) zeile++;
        feld += c;
      }
      continue;
    }
    if (c === '"') { inQ = true; feldAngefangen = true; continue; }
    if (c === t) { satz.push(feld); feld = ""; feldAngefangen = true; continue; }
    if (c === "\r" || c === "\n") {
      if (c === "\r" && s[i + 1] === "\n") i++;
      satzEnde();
      zeile++;
      start = zeile;
      continue;
    }
    feld += c;
    feldAngefangen = true;
  }
  if (feld !== "" || satz.length || feldAngefangen) satzEnde();
  const [kopfSatz, ...rest] = saetze;
  return { kopf: kopfSatz ? kopfSatz.werte.map((k) => k.trim()) : [], zeilen: rest, trenner: t };
}

  if (n.includes("sleeps") || stamm === "schlaf") return "schlaf";
  if (n.includes("workouts") || stamm === "trainings" || stamm === "training") return "training";
  if (n.includes("journal_entries") || n.includes("journal") || stamm.includes("logbuch")) return "tagebuch";
  const k = new Set(kopf.map(normName));
  const hat = (feld) => SPALTEN[feld].some((x) => k.has(normName(x)));
  if (hat("frage") && hat("antwort")) return "tagebuch";
  if (hat("trainingStart")) return "training";
  if (hat("erholung") || hat("tagesbelastung")) return "zyklen";
  if (hat("einschlafen") && hat("aufwachen")) return "schlaf";
  return null;
}

function spaltenIndex(kopf) {
  const index = new Map(kopf.map((k, i) => [normName(k), i]));
  const aus = {};
  for (const [feld, namen] of Object.entries(SPALTEN)) {
    const treffer = namen.map((x) => index.get(normName(x))).find((i) => i !== undefined);
    if (treffer !== undefined) aus[feld] = treffer;
  }
  return aus;
}

// ---------------------------------------------------------------------------------------------------
// Werte lesen
// ---------------------------------------------------------------------------------------------------

/** Zahl aus Text: "45.3", "45,3" (Dezimalkomma, auch deutsche Dateien mit ";"), "87 %", "" → null. Tausenderpunkte werden nicht gelesen. */
function leseZahl(text) {
  if (text === null || text === undefined) return null;
  let s = String(text).trim().replace(/%$/, "").trim();
  if (s === "" || /^(n\/?a|null|none|-)$/i.test(s)) return null;
  if (s.includes(",") && !s.includes(".")) s = s.replace(",", ".");
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}

/** Ja/Nein aus Text → true/false/null. */
function leseJaNein(text) {
  const s = String(text ?? "").trim().toLowerCase();
  if (["true", "yes", "ja", "1", "y", "wahr"].includes(s)) return true;
  if (["false", "no", "nein", "0", "n", "falsch"].includes(s)) return false;
  return null;
}

/** Minuten (Zahl) → ganze Millisekunden. */
function minZuMs(min) {
  return min === null ? null : Math.round(min * 60000);
}

/** Fragetext → Schlüssel: "Did you drink alcohol?" → "did_you_drink_alcohol". */
function frageSchluessel(text) {
  return String(text ?? "")
    .toLowerCase()
    .replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss")
    .replace(/[^a-z0-9]+/g, "_")
    .replace(/^_+|_+$/g, "");
}

/** Bekannte WHOOP-Aktivitätsnamen → MF-Kürzel (wie bei Health Connect). Sonst: Name als Kürzel. */
const AKTIVITAETEN = {
  running: "laufen", cycling: "radfahren", walking: "gehen", hiking: "wandern", "hiking/rucking": "wandern",
  weightlifting: "gewichtheben", "strength trainer": "krafttraining", "functional fitness": "krafttraining",
  yoga: "yoga", hiit: "hiit", swimming: "schwimmen_becken", rowing: "rudern", pilates: "pilates",
  stretching: "dehnen", soccer: "fussball", tennis: "tennis", spin: "heimtrainer", elliptical: "crosstrainer",
  activity: "sonstiges", other: "sonstiges",
};
function aktivitaetKuerzel(name) {
  const k = String(name ?? "").trim().toLowerCase();
  return AKTIVITAETEN[k] || frageSchluessel(k) || "sonstiges";
}

function median(werte) {
  const s = [...werte].sort((a, b) => a - b);
  if (!s.length) return null;
  const m = s.length >> 1;
  return s.length % 2 ? s[m] : Math.round((s[m - 1] + s[m]) / 2);
}

// ---------------------------------------------------------------------------------------------------
// Zuordnung je Datei
// ---------------------------------------------------------------------------------------------------

function zeilenLeser(kopf, satz, optionen) {
  const sp = spaltenIndex(kopf);
  return {
    sp,
    text: (feld) => (sp[feld] === undefined ? null : (satz.werte[sp[feld]] ?? "").trim()),
    zahl(feld) { return leseZahl(this.text(feld)); },
    zone() { const z = this.text("zone"); return z ? z : optionen.zone; },
    zeit(feld) { return leseZeit(this.text(feld), this.zone()); },
    zoneMin(t) { const z = this.zone(); return z === undefined || z === null ? undefined : versatzFuer(z, t) ?? undefined; },
  };
}

function quelleCsv(datei, zeile, id) {
  return { art: "csv", id, datei, zeile };
}

function mitZone(d, zoneMin) {
  if (zoneMin !== undefined) d.zoneMin = zoneMin;
  return d;
}

/** Spalten, ohne die eine Datei keine Zeile ergibt (Feldnamen aus SPALTEN). */
const ERFORDERLICH = { zyklen: ["zyklusStart"], schlaf: ["einschlafen", "aufwachen"], training: ["trainingStart"], tagebuch: ["zyklusStart", "frage"] };

/** Hinweis mit der Kopfzeile einer Datei (nur Spaltennamen, nie Werte) – damit man sie abfotografieren und die Zuordnung ergänzen kann. */
function kopfHinweis(datei, kopf, text) {
  return { datei, zeile: 1, text, kopf: [...kopf] };
}

function fehlendeSpalten(art, kopf) {
  const index = spaltenIndex(kopf);
  return (ERFORDERLICH[art] || []).filter((f) => index[f] === undefined);
}

function zyklen(datei, csv, optionen, paket, hinweise) {
  const hautRoh = [];
  for (const satz of csv.zeilen) {
    const z = zeilenLeser(csv.kopf, satz, optionen);
    const start = z.zeit("zyklusStart");
    if (start === null) {
      hinweise.push({ datei, zeile: satz.zeile, text: "Zyklusbeginn fehlt oder ist unlesbar – Zeile übersprungen." });
      continue;
    }
    // Messzeitpunkt der Nachtwerte = Aufwachen; fehlt es, Zyklusbeginn (markiert).
    const wach = z.zeit("aufwachen");
    const t = wach ?? start;
    const zoneMin = z.zoneMin(t);
    const zusatz = wach === null ? { zeitGeschaetzt: true } : {};
    if (wach === null) hinweise.push({ datei, zeile: satz.zeile, text: "Aufwachzeit fehlt – Zyklusbeginn als Messzeit genutzt." });
    const basis = `whoop:zyklus:${start}`;
    const q = (art) => quelleCsv(datei, satz.zeile, `${basis}:${art}`);
    const rhr = z.zahl("ruhepuls");
    if (rhr !== null) paket.ruhepuls.push(mitZone({ t, bpm: rhr, ...zusatz, quelle: q("ruhepuls") }, zoneMin));
    const hrv = z.zahl("hrv");
    if (hrv !== null) paket.hrv.push(mitZone({ t, rmssdMs: hrv, ...zusatz, quelle: q("hrv") }, zoneMin));
    const spo2 = z.zahl("spo2");
    if (spo2 !== null) paket.spo2.push(mitZone({ t, prozent: spo2, ...zusatz, quelle: q("spo2") }, zoneMin));
    const haut = z.zahl("hauttemp");
    if (haut !== null) hautRoh.push({ t, mc: Math.round(haut * 1000), zoneMin, zusatz, quelle: q("hauttemp") });
    // Tag der WHOOP-Werte: Aufwachtag; ohne Aufwachzeit die Zyklusmitte (siehe Tagebuch), sonst Zyklusbeginn.
    const ende = z.zeit("zyklusEnde");
    const tagBezug = wach ?? (ende !== null && ende > start ? start + Math.floor((ende - start) / 2) : start);
    const fw = { erholung: z.zahl("erholung"), belastung: z.zahl("tagesbelastung"), schlafLeistung: z.zahl("schlafLeistung") };
    if (fw.erholung !== null || fw.belastung !== null || fw.schlafLeistung !== null) {
      paket.fremdwerte.push(mitZone({
        tag: tagIso(tagBezug, z.zoneMin(tagBezug)), t, anbieter: "whoop", ...fw, ...zusatz, quelle: q("fremdwerte"),
      }, zoneMin));
    }
  }
  // WHOOP liefert die Hauttemperatur absolut. Normiert ist die Abweichung: hier zum Median aller Werte dieses
  // Imports (in Tausendstel Grad gerechnet). Die eigentliche Basislinie bildet der Kern (basislinie()).
  const basisMc = median(hautRoh.map((h) => h.mc));
  for (const h of hautRoh) {
    paket.hauttemp.push(mitZone({
      t: h.t, deltaC: (h.mc - basisMc) / 1000, absolutC: h.mc / 1000, basisC: basisMc / 1000,
      deltaBasis: "median_import", ...h.zusatz, quelle: h.quelle,
    }, h.zoneMin));
  }
}

function schlaf(datei, csv, optionen, paket, hinweise) {
  for (const satz of csv.zeilen) {
    const z = zeilenLeser(csv.kopf, satz, optionen);
    const von = z.zeit("einschlafen");
    const bis = z.zeit("aufwachen");
    if (von === null || bis === null || bis <= von) {
      hinweise.push({ datei, zeile: satz.zeile, text: "Einschlaf- oder Aufwachzeit fehlt oder ist unlesbar – Zeile übersprungen." });
      continue;
    }
    const zoneMin = z.zoneMin(bis);
    const basis = `whoop:schlaf:${von}`;
    const d = {
      von,
      bis,
      phasen: [], // WHOOP-Export enthält keine Zeitachse der Phasen
      phasenSummen: {
        wachMs: minZuMs(z.zahl("wachMin")),
        leichtMs: minZuMs(z.zahl("leichtMin")),
        tiefMs: minZuMs(z.zahl("tiefMin")),
        remMs: minZuMs(z.zahl("remMin")),
      },
      schlafMs: minZuMs(z.zahl("schlafMin")),
      imBettMs: minZuMs(z.zahl("imBettMin")),
      bedarfMs: minZuMs(z.zahl("bedarfMin")),
      schuldMs: minZuMs(z.zahl("schuldMin")),
      effizienzProzent: z.zahl("effizienz"),
      konstanzProzent: z.zahl("konstanz"),
      nickerchen: leseJaNein(z.text("nickerchen")) === true,
      fremdwerte: { anbieter: "whoop", schlafLeistung: z.zahl("schlafLeistung") },
      quelle: quelleCsv(datei, satz.zeile, basis),
    };
    paket.schlaf.push(mitZone(d, zoneMin));
    const atem = z.zahl("atem");
    if (atem !== null) {
      paket.atemfrequenz.push(mitZone({ t: bis, proMin: atem, quelle: quelleCsv(datei, satz.zeile, `${basis}:atem`) }, zoneMin));
    }
  }
}

function training(datei, csv, optionen, paket, hinweise) {
  for (const satz of csv.zeilen) {
    const z = zeilenLeser(csv.kopf, satz, optionen);
    const von = z.zeit("trainingStart");
    let bis = z.zeit("trainingEnde");
    const dauer = minZuMs(z.zahl("dauerMin"));
    if (von !== null && bis === null && dauer !== null) bis = von + dauer;
    if (von === null || bis === null || bis <= von) {
      hinweise.push({ datei, zeile: satz.zeile, text: "Trainingsbeginn oder -ende fehlt oder ist unlesbar – Zeile übersprungen." });
      continue;
    }
    const name = z.text("aktivitaet") || "";
    const zonen = ["zone1", "zone2", "zone3", "zone4", "zone5"].map((f) => z.zahl(f));
    const d = {
      von,
      bis,
      art: aktivitaetKuerzel(name),
      name,
      herzschlaege: [], // WHOOP-Export: keine Einzelherzschläge
      zonenProzent: zonen.every((x) => x === null) ? null : zonen,
      maxPuls: z.zahl("maxPuls"),
      mittelPuls: z.zahl("mittelPuls"),
      energieKcal: z.zahl("energie"),
      distanzM: z.zahl("distanz"),
      fremdwerte: { anbieter: "whoop", belastung: z.zahl("trainingsbelastung") },
      quelle: quelleCsv(datei, satz.zeile, `whoop:training:${von}`),
    };
    paket.training.push(mitZone(d, z.zoneMin(von)));
  }
}

function tagebuch(datei, csv, optionen, paket, hinweise) {
  const tage = new Map();
  for (const satz of csv.zeilen) {
    const z = zeilenLeser(csv.kopf, satz, optionen);
    const start = z.zeit("zyklusStart");
    const frage = z.text("frage");
    if (start === null || !frage) {
      hinweise.push({ datei, zeile: satz.zeile, text: "Zyklusbeginn oder Frage fehlt – Zeile übersprungen." });
      continue;
    }
    // Tag = Kalendertag der Zyklusmitte. Ein WHOOP-Zyklus läuft von Einschlafen (meist am Vorabend) bis zum
    // nächsten Einschlafen; die Mitte liegt sicher im gemeinten Tag. Ohne Zyklusende (der laufende Zyklus, Befund 31.10.2026): Mitte eines
    // Zyklus von 24 Stunden, sonst fiele der Eintrag auf den Vorabend und überschriebe die Antworten des Vortags.
    const ende = z.zeit("zyklusEnde");
    const bezug = ende !== null && ende > start ? start + Math.floor((ende - start) / 2) : start + 12 * 3600000;
    const tag = tagIso(bezug, z.zoneMin(bezug));
    if (!tage.has(tag)) {
      tage.set(tag, {
        tag, eintraege: {}, fragen: {}, notizen: {},
        quelle: quelleCsv(datei, satz.zeile, `whoop:tagebuch:${tag}`), zeilen: [],
      });
    }
    const e = tage.get(tag);
    const k = frageSchluessel(frage);
    const ja = leseJaNein(z.text("antwort"));
    if (ja !== null) e.eintraege[k] = ja;
    else {
      const n = z.zahl("antwort");
      if (n !== null) e.eintraege[k] = n;
    }
    e.fragen[k] = frage;
    const notiz = z.text("notiz");
    if (notiz) e.notizen[k] = notiz;
    e.zeilen.push(satz.zeile);
  }
  paket.tagebuch.push(...tage.values());
}

/**
 * WHOOP-Export importieren.
 * @param {{name:string, text:string}[]} dateien CSV-Dateien (Namen wie im ZIP)
 * @param {{zone?: number|string}} [optionen] Zeitzone, falls die CSV keine Spalte "Cycle timezone" hat
 *   (Minuten Versatz, "UTC+01:00" oder IANA-Name). Ohne Angabe: Gerätezeitzone.
 * @returns {{ paket: object, hinweise: {datei,zeile,text}[], dateien: {name, art, zeilen}[] }}
 */
function importiereWhoop(dateien, optionen = {}) {
  const paket = leeresPaket();
  const hinweise = [];
  const uebersicht = [];
  for (const datei of dateien) {
    const name = String(datei.name || "").split(/[\\/]/).pop();
    const csv = parseCsv(datei.text);
    const art = erkenneDatei(name, csv.kopf);
    uebersicht.push({ name, art, zeilen: csv.zeilen.length });
    if (!art) {
      hinweise.push(kopfHinweis(name, csv.kopf, "Datei nicht erkannt – nicht importiert."));
      continue;
    }
    // Erkannt, aber Spaltennamen passen nicht (z. B. andere Sprache): Zeilen nicht raten, Kopfzeile melden
    const fehlt = fehlendeSpalten(art, csv.kopf);
    if (fehlt.length) {
      hinweise.push(kopfHinweis(name, csv.kopf, `Pflichtspalten nicht gefunden (${fehlt.map((f) => SPALTEN[f][0]).join(", ")}) – Datei nicht importiert.`));
      uebersicht[uebersicht.length - 1].fehlt = fehlt;
      continue;
    }
    if (art === "zyklen") zyklen(name, csv, optionen, paket, hinweise);
    if (art === "schlaf") schlaf(name, csv, optionen, paket, hinweise);
    if (art === "training") training(name, csv, optionen, paket, hinweise);
    if (art === "tagebuch") tagebuch(name, csv, optionen, paket, hinweise);
  }
  return { paket, hinweise, dateien: uebersicht };
}
return { parseCsv, normName, SPALTEN, erkenneDatei, leseZahl, leseJaNein, frageSchluessel, kopfHinweis, importiereWhoop };
})();

// ===== daten/zip.js
const __m_daten_zip_js = (() => {
// Kleiner ZIP-Leser ohne Fremdbibliothek, damit der WHOOP-Export als ZIP direkt eingelesen werden kann.
// Unterstützt "gespeichert" (Methode 0) und "deflate" (Methode 8) über DecompressionStream
// (in allen aktuellen Browsern, Android-WebView und Node ab 18). Kein ZIP64, keine Verschlüsselung.

const SIG_ENDE = 0x06054b50;
const SIG_VERZEICHNIS = 0x02014b50;
const SIG_LOKAL = 0x04034b50;

function findeEnde(ansicht) {
  const min = Math.max(0, ansicht.byteLength - 65557);
  for (let i = ansicht.byteLength - 22; i >= min; i--) {
    if (ansicht.getUint32(i, true) === SIG_ENDE) return i;
  }
  return -1;
}

async function entpacke(bytes) {
  if (typeof DecompressionStream !== "function") {
    throw new Error("Dieses Gerät kann ZIP-Dateien nicht entpacken. Bitte die CSV-Dateien einzeln wählen.");
  }
  const strom = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return new Uint8Array(await new Response(strom).arrayBuffer());
}

/**
 * ZIP-Inhalt lesen.
 * @param {ArrayBuffer|Uint8Array} daten
 * @returns {Promise<{name:string, bytes:Uint8Array}[]>} nur Dateien, keine Ordner
 */
async function leseZip(daten) {
  const u8 = daten instanceof Uint8Array ? daten : new Uint8Array(daten);
  const ansicht = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  const ende = findeEnde(ansicht);
  if (ende < 0) throw new Error("Keine gültige ZIP-Datei.");
  const anzahl = ansicht.getUint16(ende + 10, true);
  let pos = ansicht.getUint32(ende + 16, true);
  if (pos === 0xffffffff || anzahl === 0xffff) throw new Error("ZIP64 wird nicht unterstützt.");
  const namen = new TextDecoder("utf-8");
  const aus = [];
  for (let n = 0; n < anzahl; n++) {
    if (ansicht.getUint32(pos, true) !== SIG_VERZEICHNIS) throw new Error("ZIP-Verzeichnis beschädigt.");
    const flags = ansicht.getUint16(pos + 8, true);
    const methode = ansicht.getUint16(pos + 10, true);
    const groesse = ansicht.getUint32(pos + 20, true);
    const nameLaenge = ansicht.getUint16(pos + 28, true);
    const extraLaenge = ansicht.getUint16(pos + 30, true);
    const kommentarLaenge = ansicht.getUint16(pos + 32, true);
    const lokal = ansicht.getUint32(pos + 42, true);
    const name = namen.decode(u8.subarray(pos + 46, pos + 46 + nameLaenge));
    pos += 46 + nameLaenge + extraLaenge + kommentarLaenge;
    if (name.endsWith("/")) continue;
    if (flags & 1) throw new Error(`Verschlüsselte ZIP-Datei (${name}) wird nicht unterstützt.`);
    if (ansicht.getUint32(lokal, true) !== SIG_LOKAL) throw new Error("ZIP-Eintrag beschädigt.");
    const start = lokal + 30 + ansicht.getUint16(lokal + 26, true) + ansicht.getUint16(lokal + 28, true);
    const roh = u8.subarray(start, start + groesse);
    if (methode === 0) aus.push({ name, bytes: roh.slice() });
    else if (methode === 8) aus.push({ name, bytes: await entpacke(roh) });
    else throw new Error(`ZIP-Methode ${methode} (${name}) wird nicht unterstützt.`);
  }
  return aus;
}
return { leseZip };
})();

// ===== daten/verbinden.js
const __m_daten_verbinden_js = (() => {
// Verbindungsstück der Datenschicht: stellt `window.MF.daten` bereit.
//
//   MF.daten.healthConnect.verfuegbar()        → { verfuegbar, grund }
//   MF.daten.healthConnect.verbinden(arten?, { fortschritt? }) → Rechte anfragen + abgleichen:
//     { …Messpaket, erteilt, fehlend, neu, ersetzt, arten (Bericht je Health-Connect-Art), zaehlung (gelesen je MF-Art),
//       zeitraum ({ von, bis } der gelesenen Datensätze), fehler (Texte), luecken,
//       herkunft ({ hrv: { "com.whoop.android": 12 }, … } schreibende Apps je MF-Art), schlafPhasen ({ mit, ohne } Nächte mit/ohne echte Schlafstufen) }
//     fortschritt({ typ, art, nr, von, gelesen, phase }) wird vor jedem Lesefenster gerufen (Anzeige „Lese Daten …“)
//   MF.daten.healthConnect.berechtigungen()    → { erteilt, fehlend }      (nur Rechte, ohne Abgleich)
//   MF.daten.healthConnect.synchronisieren()   → { …Messpaket, arten: {…}, neu, ersetzt }
//   MF.daten.csvImport(datei | dateien)        → { …Messpaket, neu, ersetzt, arten, zeitraum, hinweise, dateien }
//     arten = Anzahl eingelesener Datensätze je Art ({ schlaf: 7, training: 5, … }, nur Arten > 0, Summe = neu + ersetzt),
//     zeitraum = { von, bis } erster und letzter Kalendertag ("JJJJ-MM-TT") der eingelesenen Datensätze oder null
// "…Messpaket" = nur die neu hinzugekommenen Datensätze: { herzschlag: [], hrv: [], …, fremdwerte: [] }.
//   MF.daten.exportieren()                     → { format, version, erstelltMs, eintraege }
//   MF.daten.loeschen()                        → { geloescht }
//
// Alles landet im Speicher unter "messung:<art>:<JJJJ-MM-TT>" (siehe daten/ablage.js), doppelte quelle.id wird ersetzt.
// Der Speicher kommt von außen (Shell: IndexedDB, Tests: Map). Die Brücke wird bei jedem Aufruf neu gesucht,
// damit die Reihenfolge des Ladens (Capacitor vor oder nach der App) egal ist.

const hc = __m_daten_healthconnect_js;
const { installiereBruecke } = __m_daten_bruecke_capacitor_js;
const { importiereWhoop } = __m_daten_csv_import_js;
const { leseZip } = __m_daten_zip_js;
const { ARTEN, speichereMessungen, tagVon } = __m_daten_ablage_js;

/**
 * Health-Connect-Brücke suchen; fehlt sie, aus dem Capacitor-Plugin "HealthConnect" einrichten (nur in der Android-App).
 * Wird bei jedem Aufruf neu versucht, damit die Reihenfolge des Ladens egal ist. Im Browser (kein Capacitor) → null.
 */
function sucheBruecke(ziel = globalThis) {
  return hc.findeBruecke(ziel) || installiereBruecke(ziel);
}

const EXPORT_FORMAT = "maehr-fit-export";
const PRAEFIXE = ["messung:", hc.SYNC_PRAEFIX];

function istZip(name, bytes) {
  if (/\.zip$/i.test(name || "")) return true;
  return !!(bytes && bytes.length > 3 && bytes[0] === 0x50 && bytes[1] === 0x4b && bytes[2] === 3 && bytes[3] === 4);
}

/** Eine Eingabe (File, {name,text}, {name,bytes}) in CSV-Texte auflösen; ZIPs werden entpackt. */
async function zuTexten(eingabe) {
  const name = eingabe.name || "unbenannt.csv";
  if (typeof eingabe.text === "string") return [{ name, text: eingabe.text }];
  // Achtung: Bei echten File-/Blob-Objekten ist `bytes` eine Methode (Blob.bytes()), kein Feld.
  let bytes = typeof eingabe.bytes === "function" ? new Uint8Array(await eingabe.bytes()) : eingabe.bytes;
  if (!bytes && typeof eingabe.arrayBuffer === "function") bytes = new Uint8Array(await eingabe.arrayBuffer());
  if (!bytes) return [];
  if (!(bytes instanceof Uint8Array)) bytes = new Uint8Array(bytes);
  const dec = new TextDecoder("utf-8");
  if (istZip(name, bytes)) {
    const inhalt = await leseZip(bytes);
    return inhalt.filter((e) => /\.csv$/i.test(e.name)).map((e) => ({ name: e.name, text: dec.decode(e.bytes) }));
  }
  return [{ name, text: dec.decode(bytes) }];
}

  const summe = Object.values(arten).reduce((s, n) => s + (Number(n) || 0), 0);
  const saetze = [t("csv_ok_arten", { n: zahl(summe || r?.n || 0), liste: liste || "–" })];
  if (r?.zeitraum?.von) saetze.push(t("csv_zeitraum", { von: tagLang(r.zeitraum.von), bis: tagLang(r.zeitraum.bis) }));
  if (r?.hinweise?.length) saetze.push(t("csv_hinweise", { n: zahl(r.hinweise.length) }));

}

/** Anzahl je Art als Text: „60.000 Herzschlag, 20 Schlaf, …“ (nur Arten > 0, Reihenfolge wie in der Ablage). */
function artenListe(arten = {}) {
  return ARTEN.filter((a) => arten[a] > 0).map((a) => `${zahl(arten[a])} ${TEXTE["datenart_" + a] ? t("datenart_" + a) : a}`).join(", ");
}

/**
 * Health Connect nach dem Verbinden: { text, details[] }. Text = Zahl, Arten und Zeitraum (keine Messwerte);
 * details = Lücken und Fehler (wurde alles gelesen?), was auf dem Gerät liegt und der Hinweis, wenn HRV und Ruhepuls fehlen.
 */
function hcText(r) {
  if (Number.isFinite(r)) return { text: t("hc_ok", { n: zahl(r) }), details: [] };
  const summe = Object.values(r?.arten || {}).reduce((s, n) => s + (Number(n) || 0), 0);
  const sa = [t("hc_ok_arten", { n: zahl(summe || r?.n || 0), liste: artenListe(r?.arten) || "–" })];
  if (r?.zeitraum?.von) sa.push(t("csv_zeitraum", { von: tagLang(r.zeitraum.von), bis: tagLang(r.zeitraum.bis) }));
  const details = [];
  if (r?.fehler?.length) details.push(t("hc_luecken", { liste: r.fehler.join("; ") }));
  if (r?.gespeichert?.von) details.push(t("hc_gesamt", { von: tagLang(r.gespeichert.von), bis: tagLang(r.gespeichert.bis) }));
  if (r?.ohneHrvRuhepuls) details.push(t("hc_ohne_hrv"));
  // Diagnose aus daten/healthconnect.js: welche App welche Art schrieb, und ob die Nächte echte Schlafphasen haben
  if (r?.herkunft && typeof r.herkunft === "object") {
    if (!Object.keys(r.herkunft.hrv || {}).length) details.push(t("hc_hrv_keine"));
    const liste = Object.entries(r.herkunft).map(([art, apps]) => `${art}: ${Object.entries(apps).map(([app, n]) => `${app} (${zahl(n)})`).join(", ")}`).join("; ");
    if (liste) details.push(t("hc_herkunft", { liste }));
  }
  const sp = r?.schlafPhasen;
  if (sp && Number.isFinite(sp.mit) && Number.isFinite(sp.ohne) && sp.mit + sp.ohne > 0) details.push(t("hc_schlaf_phasen", { n: zahl(sp.mit + sp.ohne), m: zahl(sp.mit) }));
  return { text: sa.join(" · "), details };
}

    const k = ev.target.closest("button[data-aktion]"); if (!k) return;
    const a = k.dataset.aktion;

      status("hc", t("hc_laeuft")); details("hc", []);

      catch (e) { status("hc", t("hc_fehler", { text: fehlerText(e) })); }
      finally { hcLaeuft = false; k.disabled = false; }
    }
    if (a === "export") { try { const n = await A.exportieren(); status("export", t("export_ok", { n: zahl(n) })); } catch (e) { status("export", fehlerText(e)); } }
    if (a === "loeschen-frage" || a === "loeschen-nein") {
      const frage = a === "loeschen-frage";
      wurzel.querySelector("[data-loeschen-frage]").hidden = !frage; wurzel.querySelector("[data-loeschen-start]").hidden = frage;
      (frage ? wurzel.querySelector('[data-aktion="loeschen-nein"]') : wurzel.querySelector('[data-aktion="loeschen-frage"]'))?.focus();
    }
    if (a === "loeschen-ja") { try { await A.allesLoeschen(); } catch (e) { status("loeschen", fehlerText(e)); } }
  });
  wurzel.querySelector('input[data-aktion="csv"]')?.addEventListener("change", async (ev) => {
    const dateien = ev.target.files; if (!dateien?.length) return;
    const namen = [...dateien].map((d) => d.name);
    status("csv", t("csv_laeuft", { datei: namen.join(", ") })); details("csv", []);
    try { const r = await A.csvEinlesen(dateien); status("csv", importText(r, namen)); details("csv", kopfDetails(r?.hinweise)); }
    catch (e) { status("csv", t("csv_fehler", { text: fehlerText(e) })); details("csv", kopfDetails(e?.hinweise)); }
  });
  const form = wurzel.querySelector("form[data-einstellungen]");
  const speichern = async (teil) => { try { await A.einstellungenSetzen(teil); status("einst", t("einst_gespeichert")); } catch (e) { status("einst", fehlerText(e)); } };
  form?.addEventListener("submit", (ev) => ev.preventDefault());
  form?.addEventListener("change", (ev) => {
    const el = ev.target, w = el.value;
    if (el.name === "alter") {
      const alter = w === "" ? null : Math.round(Number(w));
      speichern({ alter });
      // Schätzung sofort nachziehen (die Ansicht wird zum Halten des Fokus nicht neu gezeichnet)
      const g = maxPulsBeleg(beleg(ctx.register), alter, ctx.demoEinstellungen?.alter), text = zahl(g.wert);
      const mp = form.querySelector('input[name="maxPuls"]'); if (mp) mp.placeholder = text;
      const k = form.querySelector('[data-q="maxpuls:schaetzung"]'); if (k) k.textContent = text;
    }
    if (el.name === "maxPuls") speichern({ maxPuls: w === "" ? null : Math.round(Number(w)) });
    if (el.name === "ruhepuls") speichern({ ruhepuls: w === "" ? null : Math.round(Number(w)) });
    if (el.name === "schlaf") speichern({ schlafBasisMs: w === "" ? null : Math.round(Number(String(w).replace(",", ".")) * 3600000) });
    if (el.name === "sprache" || el.name === "thema") speichern({ [el.name]: w });
  });
  wurzel.querySelector("[data-einst-haptik]")?.addEventListener("change", (ev) => speichern({ haptik: ev.target.checked }));
  return () => {};
}
return { importText, hcText, kopfDetails, ansicht, binde };
})();

function signatur(schluessel, methode, pfad, zeit, koerper = "") {

/** Die drei Kopfzeilen einer unterschriebenen Anfrage. */

/**
 * „MF-KOPPLUNG:<base64url(JSON)>“ lesen und prüfen. JSON: { v, host, port, geraet_id, schluessel, ablauf, name }.
 * @returns {{ host, port, geraet, schluessel: string, ablauf, name }}
 */
function kopplungLesen(text, jetzt = Date.now()) {
  const roh = String(text ?? "").trim();
  if (!roh.startsWith(KOPPEL_PRAEFIX)) throw new Error("Das ist kein Kopplungscode von MAEHR FIT.");
  let obj;
  try { obj = JSON.parse(new TextDecoder().decode(ausB64url(roh.slice(KOPPEL_PRAEFIX.length)))); } catch { throw new Error("Der Kopplungscode ist beschädigt."); }
  if (obj.v !== PROTOKOLL) throw new Error("Der Kopplungscode stammt von einer anderen Version.");
  const port = Number(obj.port);
  if (typeof obj.host !== "string" || !/^[A-Za-z0-9.:\-[\]]+$/.test(obj.host) || !Number.isInteger(port) || port < 1 || port > 65535) {
    throw new Error("Im Kopplungscode fehlt die Adresse des Rechners.");
  }
  if (typeof obj.geraet_id !== "string" || !obj.geraet_id || ausB64url(obj.schluessel || "").length !== 32) {
    throw new Error("Im Kopplungscode fehlt der Schlüssel.");
  }
  if (!Number.isFinite(obj.ablauf) || jetzt > obj.ablauf) throw new Error("Der Kopplungscode ist abgelaufen. Bitte am Rechner einen neuen erzeugen.");
  return { host: obj.host, port, geraet: obj.geraet_id, schluessel: obj.schluessel, ablauf: obj.ablauf, name: obj.name || "" };
}

/** Adresse des Rechners im Heimnetz, aus dem Kopplungscode (keine feste Adresse im Code). */
function basisAdresse(host, port) {
  const u = new URL("http:rechner");
  u.hostname = host;
  u.port = String(port);
  return u.origin;
}

// ===============================================================================================
// Was ist neu? (rein, mit eingereichtem Speicher)
// ===============================================================================================

/** Fingerabdruck eines Speicherwerts (Liste der Messwerte eines Tages). */
const abdruck = (wert) => hex(sha256(JSON.stringify(wert ?? null))).slice(0, 32);

/** Liste in Stapel zu höchstens n Einträgen. */
function stapeln(liste, n = MAX_STAPEL) {
  const aus = [];
  for (let i = 0; i < liste.length; i += n) aus.push(liste.slice(i, i + n));
  return aus;
}

/**
 * Tage, deren Messwerte sich seit dem letzten Abgleich geändert haben (Fingerabdruck je Schlüssel „messung:<art>:<tag>“).
 * @returns {Promise<{ messungen: {art, tag, daten}[], abdruecke: Object<string,string>, tage: number }>}
 */
async function aenderungen(speicher, stand = {}) {
  const alt = stand.abdruecke || {};
  const abdruecke = {}, messungen = [];
  let tage = 0;
  for (const k of (await speicher.liste("messung:")).sort()) {
    const [, art, tag] = k.split(":");
    const wert = await speicher.lies(k);
    if (!Array.isArray(wert)) continue;
    const a = abdruck(wert);
    abdruecke[k] = a;
    if (alt[k] === a) continue;
    tage += 1;
    for (const daten of wert) messungen.push({ art, tag, daten });
  }
  return { messungen, abdruecke, tage };
}

// ===============================================================================================
// AES-GCM über WebCrypto (Sendung und .mfx-Datei)
// ===============================================================================================

const subtleVon = (s) => s || globalThis.crypto?.subtle || null;
const zufall = (n) => globalThis.crypto.getRandomValues(new Uint8Array(n));

async function verschluesseln(subtle, roh, klartext, iv, aad) {
  const k = await subtle.importKey("raw", roh, { name: "AES-GCM" }, false, ["encrypt"]);
  const c = new Uint8Array(await subtle.encrypt({ name: "AES-GCM", iv, additionalData: aad }, k, klartext));
  return { iv: b64url(iv), daten: b64url(c) };
}
async function entschluesseln(subtle, roh, { iv, daten }, aad) {
  const k = await subtle.importKey("raw", roh, { name: "AES-GCM" }, false, ["decrypt"]);
  return new Uint8Array(await subtle.decrypt({ name: "AES-GCM", iv: ausB64url(iv), additionalData: aad }, k, ausB64url(daten)));
}

async function pbkdf2(subtle, passwort, salz, iterationen) {
  const basis = await subtle.importKey("raw", utf8(passwort), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: salz, iterations: iterationen }, basis, 256));
}

/** Verschlüsselte Export-Datei (.mfx) für den geteilten Ordner: PBKDF2-HMAC-SHA256 → AES-256-GCM (docs/technik/sync.md). */
async function mfxErstellen(inhalt, passwort, { subtle, iterationen = PBKDF2_ITERATIONEN, salz = zufall(16), iv = zufall(12) } = {}) {
  const s = subtleVon(subtle);
  if (!s) throw new Error("Dieses Gerät kann nicht verschlüsseln (WebCrypto fehlt).");
  if (!passwort || String(passwort).length < 8) throw new Error("Das Passwort braucht mindestens 8 Zeichen.");
  const roh = await pbkdf2(s, passwort, salz, iterationen);
  const c = await verschluesseln(s, roh, utf8(JSON.stringify(inhalt)), iv, utf8(AAD_MFX));
  return JSON.stringify({ format: MFX_FORMAT, version: 1, kdf: { name: "PBKDF2", hash: "SHA-256", iterationen, salz: b64url(salz) }, chiffre: { name: "AES-GCM", iv: c.iv }, daten: c.daten });
}

async function mfxLesen(text, passwort, { subtle } = {}) {
  const s = subtleVon(subtle);
  const obj = JSON.parse(text);
  if (obj.format !== MFX_FORMAT || obj.version !== 1) throw new Error("Keine MAEHR-FIT-Exportdatei (.mfx).");
  const roh = await pbkdf2(s, passwort, ausB64url(obj.kdf.salz), obj.kdf.iterationen);
  try {
    return JSON.parse(new TextDecoder().decode(await entschluesseln(s, roh, { iv: obj.chiffre.iv, daten: obj.daten }, utf8(AAD_MFX))));
  } catch { throw new Error("Passwort falsch oder Datei beschädigt."); }
}

/** Inhalt für die .mfx-Datei: alle Messwerte und eigenen Tagebucheinträge (Format wie daten/verbinden.js exportieren()). */
async function exportInhalt(speicher, jetzt = Date.now()) {
  const eintraege = {};
  for (const p of ["messung:", "tagebuch:"]) {
    for (const k of (await speicher.liste(p)).sort()) { const w = await speicher.lies(k); if (w !== null && w !== undefined) eintraege[k] = w; }
  }
  return { format: "maehr-fit-export", version: 1, erstelltMs: jetzt, eintraege };
}

// ===============================================================================================
// Mit dem Rechner sprechen
// ===============================================================================================

class SyncFehler extends Error {
  constructor(text, { status = 0, grund = "", wiederholbar = false } = {}) { super(text); this.status = status; this.grund = grund; this.wiederholbar = wiederholbar; }
}

const holeFetch = (f) => f || globalThis.fetch?.bind(globalThis);

async function anfrage(fetchFn, url, init) {
  const ab = typeof AbortController === "function" ? new AbortController() : null;
  const uhr = ab ? setTimeout(() => ab.abort(), ZEITLIMIT_MS) : null;
  let antwort;
  try {
    antwort = await fetchFn(url, { ...init, ...(ab ? { signal: ab.signal } : {}) });
  } catch (e) {
    throw new SyncFehler("Der Rechner ist nicht erreichbar. Läuft MAEHR FIT dort, und ist das Handy im selben WLAN?", { wiederholbar: true, grund: "netz" });
  } finally { if (uhr) clearTimeout(uhr); }
  let obj = null;
  try { obj = await antwort.json(); } catch { obj = null; }
  if (!antwort.ok) {
    const grund = obj?.grund || "";
    throw new SyncFehler(obj?.text || `Der Rechner antwortet mit Fehler ${antwort.status}.`, { status: antwort.status, grund, wiederholbar: antwort.status >= 500 || antwort.status === 409 });
  }
  return obj;
}

/** Unterschriebene Anfrage; bei Netzfehler, 5xx oder „wiederholt“ (409) neu unterschrieben bis zu VERSUCHE-mal. */
async function signiert({ fetchFn, kopplung, methode, pfad, koerperFn, jetzt, warte }) {
  const schluessel = ausB64url(kopplung.schluessel);
  let letzter;
  for (let v = 0; v < VERSUCHE; v++) {
    if (v > 0) await warte(WARTEN_MS[v - 1] ?? WARTEN_MS.at(-1));
    const zeit = jetzt();
    const koerper = koerperFn ? await koerperFn(zeit) : "";
    const kopf = { ...signaturKopf({ geraet: kopplung.geraet, schluessel, methode, pfad, zeit, koerper }), ...(koerper ? { "Content-Type": "application/json" } : {}) };
    try {
      return await anfrage(fetchFn, basisAdresse(kopplung.host, kopplung.port) + pfad, { method: methode, headers: kopf, ...(koerper ? { body: koerper } : {}) });
    } catch (e) {
      letzter = e;
      if (!e.wiederholbar) throw e;
    }
  }
  throw letzter;
}

/**
 * Mit dem Rechner koppeln: Code prüfen, beim Rechner melden (bestätigt die Kopplung innerhalb der 10 Minuten), Schlüssel ablegen.
 */
async function syncEinrichten(qrText, { speicher = globalThis.MF?.speicher, fetch, jetzt = () => Date.now(), name = "Handy", warte = pause } = {}) {
  if (!speicher) throw new Error("syncEinrichten: speicher fehlt.");
  const k = kopplungLesen(qrText, jetzt());
  const fetchFn = holeFetch(fetch);
  const status = await anfrage(fetchFn, basisAdresse(k.host, k.port) + "/api/status", { method: "GET" });
  if (status?.app !== "maehr-fit-dienst") throw new Error("Unter dieser Adresse antwortet kein MAEHR-FIT-Dienst.");
  const kopplung = { host: k.host, port: k.port, geraet: k.geraet, schluessel: k.schluessel, name: k.name || name, eingerichtet: jetzt() };
  await signiert({ fetchFn, kopplung, methode: "POST", pfad: "/api/sync", koerperFn: async () => JSON.stringify({ messungen: [] }), jetzt, warte });
  await speicher.schreib(SCHLUESSEL_KOPPLUNG, kopplung);
  await speicher.schreib(SCHLUESSEL_STAND, { abdruecke: {}, letzter: null, geraet: k.geraet });
  return { geraet: k.geraet, host: k.host, port: k.port, verschluesselung: (status.verschluesselung || []).includes("aes-256-gcm"), fingerabdruck: fingerabdruck(ausB64url(k.schluessel)) };
}

const pause = (ms) => new Promise((ok) => setTimeout(ok, ms));

/**
 * Neue und geänderte Messwerte an den Rechner schicken (Stapel ≤ 500). Der Stand wird erst nach dem letzten Stapel gesetzt;
 * bricht etwas ab, schickt der nächste Lauf dieselben Tage noch einmal (der Rechner erkennt Doppelte an quelle.id).
 */
async function syncJetzt({ speicher = globalThis.MF?.speicher, fetch, jetzt = () => Date.now(), warte = pause, subtle, stapelGroesse = MAX_STAPEL } = {}) {
  if (!speicher) throw new Error("syncJetzt: speicher fehlt.");
  const kopplung = await speicher.lies(SCHLUESSEL_KOPPLUNG);
  if (!kopplung) throw new SyncFehler("Noch nicht mit einem Rechner gekoppelt.", { grund: "nicht_gekoppelt" });
  const fetchFn = holeFetch(fetch);
  const beginn = jetzt();
  const stand = (await speicher.lies(SCHLUESSEL_STAND)) || {};
  try {
    const status = await anfrage(fetchFn, basisAdresse(kopplung.host, kopplung.port) + "/api/status", { method: "GET" });
    const s = subtleVon(subtle);
    const rechnerKann = (status?.verschluesselung || []).includes("aes-256-gcm");
    const verschluesselt = !!s && rechnerKann;
    // Warum nur unterschrieben? „rechner“: dort fehlt cryptography; „geraet“: hier kein WebCrypto (z. B. Seite über http im WLAN geöffnet)
    const ohneGrund = verschluesselt ? null : rechnerKann ? "geraet" : "rechner";
    const { messungen, abdruecke, tage } = await aenderungen(speicher, stand);
    const schluessel = ausB64url(kopplung.schluessel);
    const roh = verschluesselt ? aesRoh(schluessel) : null;
    let neu = 0, ersetzt = 0, ungueltig = 0;
    const stapel = stapeln(messungen, Math.min(stapelGroesse, status?.max_stapel || MAX_STAPEL));
    for (const teil of stapel) {
      const klartext = JSON.stringify({ messungen: teil });
      const koerperFn = verschluesselt
        ? async (zeit) => JSON.stringify(await verschluesseln(s, roh, utf8(klartext), zufall(12), aadSync(kopplung.geraet, zeit)))
        : async () => klartext;
      const r = await signiert({ fetchFn, kopplung, methode: "POST", pfad: "/api/sync", koerperFn, jetzt, warte });
      neu += r.neu || 0; ersetzt += r.ersetzt || 0; ungueltig += r.ungueltig || 0;
    }
    const letzter = { zeit: jetzt(), gesendet: messungen.length, tage, neu, ersetzt, ungueltig, stapel: stapel.length, verschluesselt, ohneVerschluesselung: ohneGrund, dauerMs: jetzt() - beginn };
    await speicher.schreib(SCHLUESSEL_STAND, { ...stand, abdruecke, letzter, fehler: null, geraet: kopplung.geraet });
    return letzter;
  } catch (e) {
    await speicher.schreib(SCHLUESSEL_STAND, { ...stand, fehler: { zeit: jetzt(), text: String(e.message || e), grund: e.grund || "" } });
    throw e;
  }
}

  const kopplung = speicher ? await speicher.lies(SCHLUESSEL_KOPPLUNG) : null;

    raf = requestAnimationFrame(uhrSchleife);
  };
  const abAbo = puls.abonniere(() => neuZeichnen("held", "kacheln", "verlauf", "zonen"));
  const abZustand = puls.beobachte(() => neuZeichnen("verbindung", "steuer"));
  if (S.stand === "laeuft") raf = requestAnimationFrame(uhrSchleife);

  const verbinde = async (demo) => {
    try { await puls.verbinden({ demo, profil: "training" }); S.demo = demo; S.geraet = puls.zustand().geraet; }
    catch (e) { if (!/cancel|abgebrochen|chosen|NotFoundError/i.test(String(e?.name || "") + String(e?.message || ""))) console.warn(e); }
    neuZeichnen("verbindung", "steuer", "held", "kacheln", "verlauf");
  };
  const klick = async (ev) => {
    const k = ev.target.closest("[data-lv]");
    if (!k || k.disabled) return;
    const a = k.dataset.lv;
    if (a === "verbinden") return verbinde(false);
    if (a === "demo") return verbinde(true);
    if (a === "trennen") { if (S.stand === "laeuft" || S.stand === "pause") await stoppen(); await puls.trennen(); neuZeichnen("verbindung", "steuer"); return; }
    if (a === "start") {
      if (S.stand === "laeuft") { S.stand = "pause"; S.pauseAb = performance.now(); cancelAnimationFrame(raf); }
      else if (S.stand === "pause") { S.pauseMs += performance.now() - S.pauseAb; S.stand = "laeuft"; raf = requestAnimationFrame(uhrSchleife); }
      else {
        Object.assign(S, { stand: "laeuft", startPerf: performance.now(), pauseAb: 0, pauseMs: 0, herzschlaege: [], rr: [], bz: null, belastung: laufendeBelastung([], E), ergebnis: null, einst: E, demo: puls.zustand().demo, geraet: puls.zustand().geraet });
        if (!S.abo) S.abo = puls.abonniere(aufnehmen);
        raf = requestAnimationFrame(uhrSchleife);
      }
      neuZeichnen("steuer", "kacheln", "zonen", "ergebnis");
      return;
    }
    if (a === "stopp") await stoppen();
  };
  async function stoppen() {
    const ende = laufzeit();
    cancelAnimationFrame(raf);
    Object.assign(S, { stand: "pause", startPerf: 0, pauseMs: 0, pauseAb: ende }); // Uhr bei „ende“ anhalten (laufzeit() = ende)
    S.abo?.(); S.abo = null;
    await speichern(ctx);
    if (sicht.isConnected) neuZeichnen("steuer", "kacheln", "ergebnis");
  }
  sicht.addEventListener("click", klick);
  return () => { cancelAnimationFrame(raf); abAbo(); abZustand(); sicht.removeEventListener("click", klick); };
}
return { uhr, pulsEinstellungen, zonenbandHtml, schlagDauer, ansicht, binde };
})();

// ===== shell/live.js
const __m_shell_live_js = (() => {
/* shell/live.js – hängt die Ansicht „Live-Puls“ in die Wege der Shell ein (#/live).
 *
 * Kernaussage: Die Live-Ansicht (shell/apps/live.js) kommt mit einem einzigen Aufruf in die Shell, ohne dass shell/shell.js
 * selbst wachsen muss: liveEinhaengen(APPS) trägt sie unter „live“ ein. Erreichbar ist sie aus „Belastung“
 * („Training live aufzeichnen“) und aus „Atem“ („Puls live ansehen“).
 *
 * Schnittstelle: liveEinhaengen(apps) → apps
 */
const live = __m_shell_apps_live_js;

function liveEinhaengen(apps) {
  if (apps && !apps.live) apps.live = live;
  return apps;
}
return { liveEinhaengen };
})();

// ===== shell/shell.js
const __m_shell_shell_js = (() => {
/* shell/shell.js – Rahmen von MAEHR FIT: Kopfleiste, Reiterleiste, Wege (#/…), Zustand, Belegfenster.
 *
 * Kernaussage: Die Shell lädt beim Start die Messwerte (beim ersten Start die erfundene Musterperson), lässt den Kern daraus die
 * Tageswerte rechnen und zeigt die gewählte Ansicht. Oben stehen höchstens sechs Dinge (Marke, Tag ‹ heute ›, Hell/Dunkel,
 * Sprache, Menü), unten fünf Reiter (Heute · Schlaf · Belastung · Atem · Mehr). Ein einziger Klick-Fang auf data-q öffnet zu
 * jeder Zahl das Belegfenster. Tagebuch, Einstellungen und eingelesene Daten gehen über die Speicher-Schnittstelle.
 *
 * Wege: #/heute · #/schlaf · #/belastung[/training/<id>] · #/atem[/<übung>] · #/mehr · #/tagebuch[/wirkung] · #/trends?feld=&fenster=
 *       · #/daten · #/einstellungen · #/vergleich?feld=&tag= · #/mehr/pruefen
 * Speicher-Schlüssel: einstellungen · tagebuch:<JJJJ-MM-TT> (eigene Einträge) · messung:<art>:<JJJJ-MM-TT> (eigene Messwerte, abgelegt von
 *   der Datenschicht daten/ablage.js) · sync:… (Stand des Health-Connect-Abgleichs, daten/healthconnect.js)
 * Datenschicht: daten/verbinden.js installiert window.MF.daten (healthConnect.verfuegbar/verbinden, csvImport) auf demselben Speicher;
 *   nach jedem Einlesen liest die Shell die Messwerte neu aus dem Speicher.
 */
const { t, setzeSprache, sprache } = __m_shell_i18n_i18n_js;
const { esc } = __m_shell_format_js;
const { neuesRegister } = __m_shell_ui_js;
const { kopfHtml, menueHtml, reiterHtml, REITER } = __m_shell_rahmen_js;
const { vizTastatur } = __m_shell_viz_viz_js;
const { speicherServer } = __m_shell_speicher_server_js;
const { sprite } = __m_shell_icons_js;
const { ankommen, scrollMerken, scrollZurueck } = __m_shell_bewegung_js;
const { demo, tagIso, tagPlus, berechne } = __m_shell_kern_js;
const { installiere: datenInstallieren } = __m_daten_verbinden_js;
const { leseMessungen } = __m_daten_ablage_js;
const { oeffnen: belegOeffnen } = __m_shell_apps_beleg_js;
const heute = __m_shell_apps_heute_js;
const schlaf = __m_shell_apps_schlaf_js;
const belastung = __m_shell_apps_belastung_js;
const atem = __m_shell_apps_atem_js;
const tagebuch = __m_shell_apps_tagebuch_js;
const trends = __m_shell_apps_trends_js;
const daten = __m_shell_apps_daten_js;
const mehr = __m_shell_apps_mehr_js;
const vergleich = __m_shell_apps_vergleich_js;
const sync = __m_shell_apps_sync_js;


const APPS = { heute, schlaf, belastung, atem, tagebuch, trends, daten, einstellungen: daten, mehr, vergleich, sync };
const ZU_MEHR = new Set(["mehr", "tagebuch", "trends", "daten", "einstellungen", "vergleich", "sync"]);
// Alle Arten der Ablage (daten/ablage.js ARTEN): spo2/hauttemp gehen als Abzüge in die Erholung, fremdwerte (WHOOPs eigene Zahlen) in den Vergleich
const DATEN_ARTEN = ["herzschlag", "hrv", "ruhepuls", "atemfrequenz", "spo2", "hauttemp", "schlaf", "training", "tagebuch", "fremdwerte"];

/** „#/belastung/training/x?feld=hrv“ → { teile: ["belastung","training","x"], abfrage: { feld: "hrv" } } */
function wegLesen(hash) {
  const roh = String(hash || "").replace(/^#\/?/, "");
  const [pfad, such = ""] = roh.split("?");
  const teile = pfad.split("/").filter(Boolean);
  const abfrage = Object.fromEntries(new URLSearchParams(such));
  if (!teile.length || !APPS[teile[0]]) teile.splice(0, teile.length, "heute");
  return { teile, abfrage };
}

const Z = { hcVerfuegbar: false, speicher: null, einst: {}, messwerte: null, demo: true, tagebuchEigen: {}, erg: null, tag: null, heute: null, register: neuesRegister(), aufraeumen: () => {} };
const anzahl = (d) => DATEN_ARTEN.reduce((s, k) => s + (Array.isArray(d?.[k]) ? d[k].length : 0), 0);

function themaAnwenden() {
  const th = Z.einst.thema || "dunkel", el = document.documentElement;
  if (th === "hell") el.dataset.theme = "light"; else if (th === "dunkel") el.dataset.theme = "dark"; else delete el.dataset.theme;
}
function spracheAnwenden() { setzeSprache(Z.einst.sprache || "de"); document.documentElement.lang = sprache(); document.title = t("app_name"); }

async function ladeAlles() {
  // Kleid „Nacht“: beim ersten Start dunkel (docs/technik/design_mf.md); umschalten über Kopfleiste oder Einstellungen
  Z.einst = { haptik: false, sprache: "de", thema: "dunkel", ...((await Z.speicher.lies("einstellungen")) || {}) };
  const eigen = {};
  for (const art of DATEN_ARTEN) eigen[art] = await leseMessungen(Z.speicher, art);
  Z.demo = !(eigen && anzahl(eigen) > 0);
  Z.messwerte = Z.demo ? demo({ heute: tagIso(Date.now()) }) : eigen;
  Z.tagebuchEigen = {};
  for (const k of await Z.speicher.liste("tagebuch:")) { const e = await Z.speicher.lies(k); if (e?.tag) Z.tagebuchEigen[e.tag] = e; }
  rechnen();
  const kalender = tagIso(Date.now());
  Z.heute = Z.demo ? (Z.erg.letzter || kalender) : (Z.erg.letzter && Z.erg.letzter > kalender ? Z.erg.letzter : kalender);
  // Startet heute ohne Messwerte (Uhr noch nicht abgeglichen), zeigt die Shell den letzten Tag mit Werten
  if (!Z.tag || Z.tag > Z.heute || (Z.erg.erster && Z.tag < Z.erg.erster)) Z.tag = Z.erg.tage.has(Z.heute) || !Z.erg.letzter ? Z.heute : Z.erg.letzter;
}
/** Einstellungen für den Kern: bei Demodaten gelten die der Musterperson, soweit du nichts eingetragen hast. */
const einstFuerKern = () => ({ ...(Z.demo ? Z.messwerte.einstellungen || {} : {}), ...Object.fromEntries(Object.entries(Z.einst).filter(([, w]) => w !== null && w !== undefined && w !== "")) });
function rechnen() { Z.erg = berechne(Z.messwerte, einstFuerKern(), Z.tagebuchEigen); }

async function tagebuchSchreiben(tag, aendern) {
  const alt = Z.tagebuchEigen[tag] || { tag, eintraege: {}, quelle: { art: "hand", id: `tagebuch-${tag}` } };
  const neu = { ...alt, eintraege: aendern({ ...alt.eintraege }) };
  await Z.speicher.schreib(`tagebuch:${tag}`, neu);
  Z.tagebuchEigen[tag] = neu; rechnen();
}

function herunterladen(name, text) {
  const url = URL.createObjectURL(new Blob([text], { type: "application/json" }));
  const a = Object.assign(document.createElement("a"), { href: url, download: name });
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/** Die Datenschicht hat schon in den Speicher geschrieben (messung:…); die Shell liest neu und rechnet. */
async function eigeneDatenUebernehmen(ergebnis) {
  if (!ergebnis || typeof ergebnis !== "object") throw new Error("keine Messwerte");
  Z.tag = null; await ladeAlles(); zeichnen();
  return Number.isFinite(ergebnis.neu) ? ergebnis.neu + (ergebnis.ersetzt || 0) : anzahl(ergebnis);
}

const aktionen = {
  /** fortschritt({ art, nr, von, gelesen }) kommt vor jedem Lesefenster (daten/healthconnect.js); Rückgabe wie bei csvEinlesen. */
  async hcVerbinden(fortschritt) {
    const r = await window.MF.daten.healthConnect.verbinden(undefined, { fortschritt });
    const n = await eigeneDatenUebernehmen(r);
    const leer = (k) => !(Z.messwerte?.[k]?.length > 0);
    return {
      n, arten: r.zaehlung || {}, zeitraum: r.zeitraum || null, fehler: r.fehler || [], luecken: r.luecken || [],
      gespeichert: Z.erg.erster ? { von: Z.erg.erster, bis: Z.erg.letzter } : null,   // alles, was jetzt auf dem Gerät liegt
      ohneHrvRuhepuls: leer("hrv") && leer("ruhepuls"),
      herkunft: r.herkunft || null, schlafPhasen: r.schlafPhasen || null, // Diagnose: welche App schrieb was, Nächte mit/ohne Phasen (shell/apps/daten.js)
    };
  },
  async csvEinlesen(dateien) {
    // Dateien vorab als { name, bytes } übergeben: Blob.bytes() ist in neuen Browsern eine Methode, die daten/verbinden.js
    // sonst als Inhalt läse (Befund 30.10.2026, an die Datenschicht gemeldet).
    const liste = await Promise.all([...(dateien?.length !== undefined ? dateien : [dateien])].map(async (d) => ({ name: d.name, bytes: new Uint8Array(await d.arrayBuffer()) })));
    // Rückgabe für daten.js: Gesamtzahl, Anzahl je Art und eingelesener Zeitraum (daten/verbinden.js csvImport)
    const r = await window.MF.daten.csvImport(liste);
    const n = await eigeneDatenUebernehmen(r);
    return { n, arten: r.arten || {}, zeitraum: r.zeitraum || null, hinweise: r.hinweise || [] };
  },
  async exportieren() {
    const schluessel = await Z.speicher.liste("");
    const inhalt = {};
    for (const k of schluessel) inhalt[k] = await Z.speicher.lies(k);
    herunterladen(`maehr-fit-${tagIso(Date.now())}.json`, JSON.stringify({ app: "MAEHR FIT", erstellt: new Date().toISOString(), daten: inhalt }, null, 2));
    return schluessel.length;
  },
  async allesLoeschen() {
    if (Z.speicher.loescheAlles) await Z.speicher.loescheAlles();
    else for (const k of await Z.speicher.liste("")) await Z.speicher.schreib(k, undefined);
    Z.tag = null; await ladeAlles(); themaAnwenden(); spracheAnwenden();
    location.hash = "#/heute"; zeichnen();
  },
  async einstellungenSetzen(teil) {
    Z.einst = { ...Z.einst, ...teil };
    await Z.speicher.schreib("einstellungen", Z.einst);
    themaAnwenden();
    if ("sprache" in teil) { spracheAnwenden(); rechnen(); zeichnen(); return; }
    if ("thema" in teil) { zeichnen(); return; }
    rechnen();
  },
};

function kontext(weg) {
  return {
    demoEinstellungen: Z.demo ? Z.messwerte.einstellungen || null : null, tag: Z.tag, heute: Z.heute, bild: Z.erg.tage.get(Z.tag) || null, erg: Z.erg, einst: Z.einst, demo: Z.demo, route: weg, register: Z.register,
    tagebuchEigen: Z.tagebuchEigen, atemHeuteMs: Number(Z.tagebuchEigen[Z.heute]?.eintraege?.atem) || 0,
    hcVerfuegbar: Z.hcVerfuegbar, csvVerfuegbar: typeof window.MF?.daten?.csvImport === "function",
    aktionen,
    tagebuchSetzen: (tag, k, w) => tagebuchSchreiben(tag, (e) => ({ ...e, [k]: w })),
    atemSpeichern: (ms) => tagebuchSchreiben(Z.heute, (e) => ({ ...e, atem: (Number(e.atem) || 0) + ms, atemuebung: true })),
  };
}

let letzterWeg = "";
function zeichnen() {
  const wurzel = document.getElementById("mf-wurzel");
  const weg = wegLesen(location.hash), id = weg.teile[0], app = APPS[id];
  const wegText = weg.teile.join("/"), neu = wegText !== letzterWeg;
  if (neu) scrollMerken(letzterWeg);
  Z.aufraeumen(); Z.aufraeumen = () => {};
  Z.register = neuesRegister();
  const aktiv = ZU_MEHR.has(id) ? "mehr" : id;
  const chip = Z.demo && !["daten", "einstellungen", "atem", "mehr", "sync"].includes(id) ? `<div class="mf-chip" data-demo><i aria-hidden="true"></i><span>${esc(t("demo_chip"))}</span><a class="mf-knopf" href="#/daten">${esc(t("demo_verbinden"))}</a></div>` : "";
  let inhalt;
  try { inhalt = app.ansicht(kontext(weg)); } catch (e) { console.error(e); inhalt = `<p class="mf-hinweis">${esc(t("fehler_start", { text: e?.message || e }))}</p>`; }
  wurzel.innerHTML = `${kopfHtml({ tag: Z.tag, heute: Z.heute, erster: Z.erg.erster, thema: Z.einst.thema })}${menueHtml()}<main class="mf-haupt" id="mf-haupt" tabindex="-1">${chip ? `<div class="mf-sicht-chip">${chip}</div>` : ""}${inhalt}</main>${reiterHtml(aktiv)}`;
  document.body.dataset.reiter = aktiv;
  if (typeof app.binde === "function") Z.aufraeumen = app.binde(wurzel.querySelector("#mf-haupt"), kontext(weg)) || (() => {});
  // Reiter merken sich die Stelle: zurück zu einer Ansicht = dieselbe Scrollhöhe; neue Ansichten tauchen gestaffelt auf
  if (neu) { scrollZurueck(wegText); letzterWeg = wegText; }
  ankommen(wurzel.querySelector("#mf-haupt"), { neu });
}

function menueSchalten(auf) {
  const m = document.getElementById("mf-menue"), k = document.querySelector('[data-kopf="menue"]');
  if (!m || !k) return;
  const offen = auf ?? m.hidden;
  m.hidden = !offen; k.setAttribute("aria-expanded", String(offen));
  if (offen) m.querySelector("a")?.focus();
}

function klicks() {
  vizTastatur(document);
  const dialog = document.getElementById("mf-beleg");
  document.addEventListener("click", (ev) => {
    const q = ev.target.closest("[data-q]");
    if (q) { ev.preventDefault(); belegOeffnen(dialog, Z.register.get(q.dataset.q), q.dataset.q); return; }
    if (ev.target.closest("[data-beleg-zu]")) { dialog.close?.(); dialog.removeAttribute("open"); return; }
    const tagK = ev.target.closest("[data-tag]");
    if (tagK) {
      const w = tagK.dataset.tag;
      Z.tag = w === "heute" ? Z.heute : w === "letzter" ? (Z.erg.letzter || Z.heute) : tagPlus(Z.tag, Number(w));
      if (Z.tag > Z.heute) Z.tag = Z.heute;
      if (Z.erg.erster && Z.tag < Z.erg.erster) Z.tag = Z.erg.erster;
      const weg = wegLesen(location.hash);
      if (weg.teile[0] === "belastung" && weg.teile[1] === "training") location.hash = "#/belastung"; else zeichnen();
      document.querySelector(`[data-tag="${w}"]:not(:disabled)`)?.focus();
      return;
    }
    const kopfK = ev.target.closest("[data-kopf]");
    if (kopfK) {
      const a = kopfK.dataset.kopf;
      if (a === "menue") { menueSchalten(); return; }
      if (a === "thema") { const folge = { auto: "hell", hell: "dunkel", dunkel: "auto" }; aktionen.einstellungenSetzen({ thema: folge[Z.einst.thema || "auto"] }).then(() => document.querySelector('[data-kopf="thema"]')?.focus()); return; }
      if (a === "sprache") { aktionen.einstellungenSetzen({ sprache: sprache() === "de" ? "en" : "de" }).then(() => document.querySelector('[data-kopf="sprache"]')?.focus()); return; }
    }
    if (!ev.target.closest("#mf-menue")) menueSchalten(false);
  });
  dialog.addEventListener("click", (ev) => { if (ev.target === dialog) dialog.close?.(); });
  document.addEventListener("keydown", (ev) => { if (ev.key === "Escape") menueSchalten(false); });
  window.addEventListener("hashchange", () => { menueSchalten(false); if (dialog.open) dialog.close?.(); zeichnen(); });
}

async function start() {
  try {
    if (!document.querySelector(".mf-sprite")) document.body.insertAdjacentHTML("afterbegin", sprite());
    Z.speicher = await speicherServer();
    window.MF = Object.assign(window.MF || {}, { speicher: Z.speicher });
    try {
      datenInstallieren(window, { speicher: Z.speicher });
      Z.hcVerfuegbar = !!(await window.MF.daten.healthConnect.verfuegbar())?.verfuegbar;
    } catch (e) { console.warn("Datenschicht:", e); }
    await ladeAlles();
    themaAnwenden(); spracheAnwenden();
    window.MF = Object.assign(window.MF || {}, { shell: { neuLaden: async () => { await ladeAlles(); zeichnen(); }, speicher: Z.speicher } });
    klicks();
    zeichnen();
  } catch (e) {
    console.error(e);
    const w = document.getElementById("mf-wurzel");
    if (w) w.innerHTML = `<main class="mf-haupt"><p class="mf-hinweis">${esc(t("fehler_start", { text: e?.message || e }))}</p></main>`;
  }
}

const { liveEinhaengen } = __m_shell_live_js;
liveEinhaengen(APPS);
if (typeof document !== "undefined" && document.getElementById("mf-wurzel")) start();
return { APPS, DATEN_ARTEN, wegLesen, start, REITER };
})();
</script>
