<style>
/* shell/design/marke.css – die eine Farb- und Schriftquelle von MAEHR FIT (MF), angepasste Kopie von MBS shell/design/marke.css.

   ============================================================================================
   Kernaussage: Hier – und nur hier – stehen Farbwerte. Alle anderen Stylesheets (design.css, design_viz.css, design_atem.css,
   design_mobil.css) verweisen nur auf diese Namen. Die Werte sind dieselben wie in der MAEHR BUSINESS SUITE (Kleid „Ruhe“),
   damit MF und MBS wie aus einem Guss aussehen.
   --------------------------------------------------------------------------------------------
   Regeln:  Grün heißt weiter (Knopf, aktiver Reiter, Ring, Fokus) und „gut erholt“ (immer mit Wort, nie nur Farbe).
            Bernstein heißt „mittel“ bzw. bitte hinsehen, Rot heißt „wenig erholt“ oder Fehler – je mit Wort oder Zeichen.
            Barlow Condensed für Titel und große Zahlen, Barlow für Sätze (sportlich, Entscheidung Loris 30.10.2026).
   Benennung: --m-… gilt hell und dunkel gleich, --m-h-… hell, --m-d-… dunkel. Die Verbraucher wählen in ihren drei Blöcken
            (hell, @media dunkel, [data-theme="dark"]) den passenden Satz.
   MF-Ergänzungen: --m-*-fehler-weich, --m-*-vz-… (Diagramme, Zonen, Schlafphasen) und --m-*-erholung-gruen/gelb/rot
            (Verweise auf ok/bernstein/fehler).
   Kleid „Nacht“ (MF-Design, docs/technik/design_mf.md): drei Flächenstufen --m-*-flaeche-1/2/3 (Höhe durch Tonstufen statt
            Schatten), Haarlinie und Innenkante mit Alpha, Leuchten je Erholungsstufe (--m-*-glow-…) und hellere Enden für die
            Verläufe (--m-*-…-hell). Dunkel ist die Grundeinstellung beim ersten Start.
   Kontrast (WCAG 2.2 AA, gerechnet in tests/node/ruhe.test.mjs): Schrift ≥ 4,5:1 auf Papier und Grund, Grafik ≥ 3:1.
   ============================================================================================ */
:root {
  /* Bühne Nachtgrün (hell und dunkel gleich) */
  --m-nacht: #0b110e; --m-nacht-2: #153a31; --m-auf-nacht: #eaf1ec; --m-auf-nacht-neben: #a3b5ab; --m-minze: #53c3a2; --m-weiss: #ffffff;
  /* Hell: Salbei-Flächen, Tinte, Grün = Aktion */
  --m-h-papier: #ffffff; --m-h-grund: #f4f6f3; --m-h-flaeche2: #eaefeb; --m-h-linie: #dde4df; --m-h-linie-stark: #7c8a82; --m-h-leise: #5e6a63;
  --m-h-tinte: #17201b; --m-h-tinte2: #36403b;
  --m-h-gruen: #0a6551; --m-h-gruen-weich: #e4f1ec; --m-h-auf-gruen: #ffffff;
  --m-h-ok: #1d7a45; --m-h-ok-weich: #e3f1e8;
  /* Hell: Bernstein = hinsehen, Rot = Fehler */
  --m-h-bernstein: #8f5a00; --m-h-bernstein-punkt: #b77c0e; --m-h-bernstein-weich: #fbf1dc;
  --m-h-fehler: #b3261e; --m-h-fehler-weich: #fbe4e2;
  /* Hell: Diagramme (MBS design_viz.css, Paletten-Prüfer bestanden) + Zone 1 leise */
  --m-h-vz-k1: #13896b; --m-h-vz-k2: #2a78d6; --m-h-vz-k3: #e0662f; --m-h-vz-k4: #6250d6; --m-h-vz-k0: #6b7f76;
  /* Dunkel */
  --m-d-papier: #19211d; --m-d-grund: #111714; --m-d-flaeche2: #222b26; --m-d-linie: #2c3631; --m-d-linie-stark: #6a7971; --m-d-leise: #9aa79f;
  --m-d-tinte: #eef2ef; --m-d-tinte2: #d0d9d3;
  --m-d-gruen: #53c3a2; --m-d-gruen-weich: #173029; --m-d-auf-gruen: #0b110e;
  --m-d-ok: #5cc98a; --m-d-ok-weich: #16291e;
  --m-d-bernstein: #e6ab4f; --m-d-bernstein-punkt: #e6ab4f; --m-d-bernstein-weich: #33280f;
  --m-d-fehler: #f08a83; --m-d-fehler-weich: #3a1613;
  --m-d-vz-k1: #1f9c7c; --m-d-vz-k2: #3987e5; --m-d-vz-k3: #e0703f; --m-d-vz-k4: #9085e9; --m-d-vz-k0: #8a9c93;
  /* Erholung: Verweise auf die Signale (MF) */
  --m-h-erholung-gruen: var(--m-h-ok); --m-h-erholung-gelb: var(--m-h-bernstein-punkt); --m-h-erholung-rot: var(--m-h-fehler);
  --m-d-erholung-gruen: var(--m-d-ok); --m-d-erholung-gelb: var(--m-d-bernstein-punkt); --m-d-erholung-rot: var(--m-d-fehler);
  /* Kleid „Nacht“: Flächenstufen (1 Karte · 2 Kachel/innen · 3 Pille/gedrückt), Haarlinie, Innenkante, Glas der Leisten */
  --m-d-flaeche-1: #131d19; --m-d-flaeche-2: #19251f; --m-d-flaeche-3: #213029;
  --m-d-haarlinie: rgba(234, 241, 236, .09); --m-d-innenkante: rgba(255, 255, 255, .05); --m-d-glas: rgba(11, 17, 14, .74);
  --m-h-flaeche-1: #ffffff; --m-h-flaeche-2: #f7f9f7; --m-h-flaeche-3: #eaefeb;
  --m-h-haarlinie: rgba(23, 32, 27, .09); --m-h-innenkante: rgba(255, 255, 255, .9); --m-h-glas: rgba(244, 246, 243, .82);
  /* Leuchten je Erholungsstufe (Ring, Bogen) und hellere Verlaufsenden – Grafik ≥ 3 : 1 auf Fläche 1 */
  --m-d-glow-gruen: rgba(92, 201, 138, .55); --m-d-glow-gelb: rgba(230, 171, 79, .5); --m-d-glow-rot: rgba(240, 138, 131, .5); --m-d-glow-akzent: rgba(83, 195, 162, .45);
  --m-d-gruen-hell: #a6ebc0; --m-d-gelb-hell: #f5d08f; --m-d-rot-hell: #f8b9b4; --m-d-akzent-hell: #9fe3cd;
  --m-h-glow-gruen: rgba(29, 122, 69, .28); --m-h-glow-gelb: rgba(183, 124, 14, .26); --m-h-glow-rot: rgba(179, 38, 30, .24); --m-h-glow-akzent: rgba(10, 101, 81, .22);
  --m-h-gruen-hell: #2f9a5c; --m-h-gelb-hell: #b67d10; --m-h-rot-hell: #d0453c; --m-h-akzent-hell: #13896b;
  /* Bühne: Nachtgrün oben, verläuft in die Nacht; hell: Salbei mit leichtem Grünschimmer oben */
  --m-h-buehne-oben: #e4f1ec;
  /* Abdunkeln hinter dem Belegfenster */
  --m-h-abdunkeln: rgba(11, 17, 14, .32); --m-d-abdunkeln: rgba(0, 0, 0, .55);
  /* Schriftpaar */
  --m-schrift-titel: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --m-schrift-text: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
</style>
<style>
/* shell/design/design.css – Tokens, Grundlage und Bausteine von MAEHR FIT im Kleid „Ruhe“ der MBS.

   ============================================================================================
   Kernaussage: MF trägt das Kleid „Nacht“ (docs/technik/design_mf.md): eine nachtgrüne Bühne, darauf Flächen in drei Tonstufen
   statt Schatten, je mit Haarlinie und 1 px heller Innenkante; die Erholung leuchtet in ihrer Farbe. Hell bleibt das ruhige
   MBS-Kleid (Salbei-Grund, weiße Karten). Barlow Condensed für Zahlen und Titel, Barlow für Sätze, Knöpfe als Pillen. Grün heißt
   „weiter“ oder „gut“, Bernstein „hinsehen“, Rot „wenig“ bzw. Fehler – immer zusammen mit einem Wort.
   --------------------------------------------------------------------------------------------
   Token-Blöcke: hell (:root), dunkel zweimal mit denselben Werten – @media (prefers-color-scheme: dark) :root:not([data-theme="light"])
            und :root[data-theme="dark"] (wie MBS; tests/node/ruhe.test.mjs prüft Gleichheit). Keine Hex-Farbe hier: alle Werte
            verweisen auf shell/design/marke.css.
   Abstände --r1..--r6 = 4/8/12/16/24/32 px · Radien 12/16/24, Pille 999 px · Schrift --t-1 12 … --t-6 22, --t-held 72/96.
   Flächen: --flaeche-1 Karte · --flaeche-2 Kachel/innen · --flaeche-3 Pille/gedrückt; --haarlinie, --innenkante, --glas (Leisten).
   Leuchten: --glow-gruen/gelb/rot/akzent, Verlaufsenden --erholung-*-hell, --akzent-hell.
   Bewegung höchstens 450 ms, --kurve cubic-bezier(.33,1,.68,1), nur Deckkraft und Transform, aus bei prefers-reduced-motion.
   ============================================================================================ */
:root {
  color-scheme: light;
  --papier: var(--m-h-papier); --grau-1: var(--m-h-grund); --grau-2: var(--m-h-flaeche2); --grau-3: var(--m-h-linie); --grau-4: var(--m-h-linie-stark); --grau-5: var(--m-h-leise);
  --tinte: var(--m-h-tinte); --tinte2: var(--m-h-tinte2);
  --akzent: var(--m-h-gruen); --akzent-weich: var(--m-h-gruen-weich); --auf-akzent: var(--m-h-auf-gruen); --marke: var(--m-h-gruen);
  --ok: var(--m-h-ok); --ok-weich: var(--m-h-ok-weich); --warn: var(--m-h-bernstein); --warn-punkt: var(--m-h-bernstein-punkt); --warn-weich: var(--m-h-bernstein-weich);
  --fehler: var(--m-h-fehler); --fehler-weich: var(--m-h-fehler-weich);

/* ---------- Grundlage: Bühne (Nachtgrün oben, verläuft in die Nacht; hell Salbei mit Grünschimmer) */
* { box-sizing: border-box; }
html { background: var(--buehne-unten); }
html, body { margin: 0; color: var(--tinte); }
body { background: transparent; font: 400 var(--t-3)/var(--zeilenhoehe) var(--schrift-text); -webkit-font-smoothing: antialiased; font-synthesis-weight: none;
  min-height: 100dvh; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: radial-gradient(130% 62% at 50% -12%, var(--buehne-oben) 0%, transparent 62%), var(--buehne-unten); }
h1, h2, h3 { font-family: var(--schrift-titel); font-weight: 600; letter-spacing: .01em; text-transform: uppercase; margin: 0; color: var(--tinte); }
h1 { font-size: 30px; line-height: 1.15; } h2 { font-size: var(--t-6); line-height: 1.25; } h3 { font-size: 18px; line-height: 1.3; }
p { margin: 0; }
a { color: var(--akzent); }
:focus-visible { outline: var(--fokus); outline-offset: 2px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
.mf-sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
.mf-ikon { flex: none; }
.mf-zurueck svg { width: 20px; height: 20px; }
.mf-versteckt { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Fläche mit Haarlinie und heller Innenkante – Höhe durch Tonstufe, nicht durch Schatten */
.mf-karte, .mf-gliederung, .mf-liste, .mf-kachel, .mf-trainings > li > a, dialog.mf-beleg, .mf-menue {
  border: 1px solid var(--haarlinie); box-shadow: inset 0 1px 0 var(--innenkante); }

/* ---------- Kopfleiste (≤ 6 Elemente) als Glas: durchscheinend mit Unschärfe, ohne Unterstützung deckend */
.mf-kopf { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 2px; height: calc(var(--kopf-hoehe) + env(safe-area-inset-top));
  padding: env(safe-area-inset-top) max(var(--r3), env(safe-area-inset-right)) 0 max(var(--r4), env(safe-area-inset-left));
  background: var(--grau-1); border-bottom: 1px solid var(--haarlinie); }
@supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .mf-kopf, .mf-reiter { background: var(--glas); -webkit-backdrop-filter: blur(18px) saturate(1.5); backdrop-filter: blur(18px) saturate(1.5); }
}
.mf-marke { font-family: var(--schrift-titel); font-weight: 700; font-size: 26px; letter-spacing: .03em; color: var(--marke); text-decoration: none; margin-right: auto; line-height: 1; padding: 8px 4px; }
.mf-tagwahl { display: flex; align-items: center; gap: 0; min-width: 0; margin-right: 4px; padding: 0 2px; border-radius: var(--radius-pille); background: var(--flaeche-2); border: 1px solid var(--haarlinie); }
.mf-tagwahl .mf-rund { width: 40px; height: 40px; }
.mf-tagwahl .mf-tag-text { min-width: 0; max-width: 120px; padding: 0 4px; height: 40px; border: 0; background: none; border-radius: var(--radius-pille); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  font-family: var(--schrift-titel); font-size: 17px; font-weight: 600; letter-spacing: .02em; color: var(--tinte); }
.mf-rund { flex: none; width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; padding: 0; border: 0; background: none; border-radius: var(--radius-pille); color: var(--tinte2);
  transition: transform var(--dauer-druck) var(--kurve), opacity var(--dauer-druck) var(--kurve); }
.mf-rund:hover, .mf-tagwahl .mf-tag-text:hover { background: var(--flaeche-3); }
.mf-rund:active { transform: scale(.94); }
.mf-rund:disabled { opacity: .38; cursor: default; background: none; transform: none; }
.mf-rund svg { width: 22px; height: 22px; }
.mf-sprache-text { font-size: var(--t-2); font-weight: 600; letter-spacing: .06em; }
.mf-menue { position: fixed; z-index: 30; top: calc(var(--kopf-hoehe) + env(safe-area-inset-top) + 6px); right: max(var(--r3), env(safe-area-inset-right)); min-width: 232px; max-width: calc(100vw - 24px);
  display: flex; flex-direction: column; padding: var(--r2); background: var(--flaeche-2); border-radius: var(--radius-2); }
.mf-menue[hidden] { display: none; }
.mf-menue a, .mf-menue button { display: flex; align-items: center; min-height: 44px; padding: 0 var(--r3); border: 0; background: none; border-radius: var(--radius-1); text-align: left; color: var(--tinte); text-decoration: none; font-size: var(--t-3); }
.mf-menue a:hover, .mf-menue button:hover { background: var(--flaeche-3); }

/* ---------- Hauptbereich und untere Reiterleiste (Glas, aktive Pille hinter dem Symbol) */
.mf-haupt { max-width: 640px; margin: 0 auto; padding: var(--r4) max(var(--r4), env(safe-area-inset-right)) calc(var(--reiter-hoehe) + var(--r6) + env(safe-area-inset-bottom)) max(var(--r4), env(safe-area-inset-left)); }
.mf-haupt:focus { outline: none; }
.mf-sicht { display: flex; flex-direction: column; gap: var(--r5); min-width: 0; }
.mf-reiter { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
  padding: 0 max(var(--r2), env(safe-area-inset-right)) env(safe-area-inset-bottom) max(var(--r2), env(safe-area-inset-left));
  background: var(--flaeche-1); border-top: 1px solid var(--haarlinie); }
.mf-reiter a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; height: var(--reiter-hoehe); min-width: 0;
  color: var(--grau-5); text-decoration: none; font-size: var(--t-1); font-weight: 500; letter-spacing: .02em; border-radius: var(--radius-1); }
.mf-reiter-ikon { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 56px; height: 30px; }
.mf-reiter-ikon::before { content: ""; position: absolute; inset: 0; border-radius: var(--radius-pille); background: var(--akzent-weich);
  opacity: 0; transform: scaleX(.55); transition: transform var(--dauer-kurz) var(--kurve), opacity var(--dauer-kurz) var(--kurve); }
.mf-reiter-ikon svg { position: relative; width: 24px; height: 24px; }
.mf-reiter-text { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mf-reiter a:active .mf-reiter-ikon { transform: scale(.94); transition: transform var(--dauer-druck) var(--kurve); }
.mf-reiter a[aria-current="page"] { color: var(--tinte); font-weight: 600; }
.mf-reiter a[aria-current="page"] .mf-reiter-ikon { color: var(--akzent); }
.mf-reiter a[aria-current="page"] .mf-reiter-ikon::before { opacity: 1; transform: none; }
.mf-reiter a[aria-current="page"] svg { stroke-width: 2.1; }

/* ---------- Kernaussage, Titel, Abschnitte */
.mf-titelzeile { display: flex; flex-direction: column; gap: var(--r2); }
.mf-zurueck { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px 0 8px; margin-left: -8px; border: 0; background: none; border-radius: var(--radius-pille); color: var(--akzent); font-weight: 500; text-decoration: none; }
.mf-zurueck:hover { background: var(--flaeche-3); }
.mf-kern { font-size: 19px; line-height: 1.45; color: var(--tinte); max-width: 36ch; letter-spacing: -.003em; }
.mf-held .mf-kern { text-align: center; margin: 0 auto; font-size: 21px; line-height: 1.4; max-width: 30ch; }
.mf-abschnitt { display: flex; flex-direction: column; gap: var(--r3); min-width: 0; }
.mf-beschriftung, .mf-abschnitt > h2.mf-beschriftung { font-family: var(--schrift-text); font-size: var(--t-1); font-weight: 600; letter-spacing: var(--beschriftung-abstand); text-transform: uppercase; color: var(--grau-5); line-height: 1.4; }
.mf-leise { color: var(--grau-5); font-size: var(--t-2); }
.mf-held { display: flex; flex-direction: column; align-items: center; gap: var(--r4); text-align: center; }
.mf-held-woche { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 100%; max-width: 280px; }
.mf-held-woche .vz-spark-huelle { width: 100%; }
.mf-held-woche .mf-leise { line-height: 1.5; }
.mf-held-woche .mf-link { white-space: nowrap; display: inline-flex; align-items: center; min-height: 32px; }
.mf-leer { display: flex; flex-direction: column; align-items: center; gap: var(--r4); padding: var(--r5) 0; text-align: center; }
.mf-leer .mf-kern { text-align: center; }
.mf-leerbild { width: 132px; height: auto; }
.mf-leerbild .lb-linie { stroke: var(--grau-3); } .mf-leerbild .lb-leise { stroke: var(--grau-4); } .mf-leerbild .lb-akzent { stroke: var(--akzent); }
.mf-leerbild .lb-punkt { fill: var(--akzent); stroke: none; }

/* ---------- Karten und Kacheln (Fläche 1 bzw. 2, Haarlinie, Innenkante) */
.mf-karte { background: var(--flaeche-1); border-radius: var(--radius-3); padding: var(--r5); min-width: 0; }
.mf-kacheln { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--r3); }
.mf-kachel { position: relative; display: flex; flex-direction: column; gap: 6px; padding: var(--r4); background: var(--flaeche-1); border-radius: var(--radius-3); min-width: 0;
  transition: transform var(--dauer-druck) var(--kurve); }
.mf-kachel[data-tipp] { cursor: pointer; }
.mf-kachel[data-tipp]:hover { background: var(--flaeche-2); }
.mf-kachel[data-tipp]:active { transform: scale(.98); background: var(--flaeche-2); }
.mf-kachel-titel { font-size: var(--t-1); font-weight: 600; letter-spacing: var(--beschriftung-abstand); text-transform: uppercase; color: var(--grau-5); line-height: 1.3; }
.mf-kachel-wert { display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px 5px; min-width: 0; }
.mf-kachel-wert .zahl, .mf-kachel-wert .zahl-text { font-family: var(--schrift-titel); font-weight: 600; font-size: var(--t-anzeige); line-height: 1.05; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.mf-einheit { font-size: var(--t-2); color: var(--tinte2); }
.mf-kachel-bild { display: block; width: 100%; min-height: 30px; margin: 2px 0 2px; }
.mf-kachel-bild svg { display: block; width: 100%; height: auto; max-height: 44px; }
.mf-vergleich { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 6px; font-size: var(--t-2); color: var(--grau-5); line-height: 1.3; margin-top: auto; }
.mf-vergleich-text { min-width: 0; }
.mf-vergleich[data-richtung="neu"] .mf-pfeil { display: none; }
.mf-pfeil { flex: none; width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; background: var(--flaeche-3); color: var(--tinte2); font-size: 12px; line-height: 1; }
/* Abstand zum Mittel als Pille („+6 ms“) – Zahl-Knopf, Richtung als Zeichen, nie nur Farbe */
button.zahl.mf-delta { display: inline-flex; align-items: center; gap: 3px; min-height: 26px; padding: 2px 9px 2px 7px; border-radius: var(--radius-pille); background: var(--flaeche-3);
  color: var(--tinte); font-family: var(--schrift-titel); font-size: 15px; font-weight: 600; letter-spacing: .01em; line-height: 1; white-space: nowrap; text-decoration: none; }
button.zahl.mf-delta span { color: var(--akzent); font-family: var(--schrift-text); font-size: 13px; }
button.zahl.mf-delta[data-richtung="gleich"] span, button.zahl.mf-delta[data-richtung="neu"] span { color: var(--grau-5); }
button.zahl.mf-delta:hover, button.zahl.mf-delta:focus-visible { background: var(--akzent-weich); }
.mf-marke-chip { display: inline-flex; align-self: center; align-items: center; min-height: 28px; padding: 2px 12px; border-radius: var(--radius-pille); background: var(--warn-weich); color: var(--warn); font-size: var(--t-2); font-weight: 500; }
.mf-training .mf-marke-chip { align-self: flex-start; }

/* ---------- Zahlen als Knöpfe (Prüfpfad, data-q) */
button.zahl { background: none; border: 0; padding: 0 2px; margin: 0; color: inherit; font: inherit; cursor: pointer; text-align: inherit; border-radius: var(--r1);
  text-decoration: underline dotted transparent; text-underline-offset: 4px; font-variant-numeric: tabular-nums; }
button.zahl:hover, button.zahl:focus-visible { text-decoration-color: var(--akzent); }
.mf-kern button.zahl { font-weight: 600; color: var(--tinte); text-decoration: underline dotted var(--grau-4); text-decoration-thickness: 1.5px; }

/* ---------- Knöpfe (Pillen), Druck: scale .98 in 150 ms */
.mf-knopf { display: inline-flex; align-items: center; justify-content: center; gap: var(--r2); min-height: 48px; padding: 0 var(--r5); border: 1px solid var(--haarlinie); border-radius: var(--radius-pille);
  background: var(--flaeche-2); color: var(--tinte); font-weight: 500; text-decoration: none; box-shadow: inset 0 1px 0 var(--innenkante);
  transition: transform var(--dauer-druck) var(--kurve), opacity var(--dauer-druck) var(--kurve); }
.mf-knopf svg { width: 20px; height: 20px; color: var(--akzent); }
.mf-knopf:hover { background: var(--flaeche-3); }
.mf-knopf:active { transform: scale(.98); }
.mf-knopf.primaer { background: var(--akzent); border-color: transparent; color: var(--auf-akzent); font-weight: 600; }
.mf-knopf.primaer svg { color: currentColor; }
.mf-knopf.primaer:hover { background: var(--akzent); opacity: .92; }
.mf-knopf.leise { border-color: transparent; background: none; color: var(--akzent); box-shadow: none; }
.mf-knopf.leise:hover { background: var(--flaeche-3); }

   zusammen höchstens 450 ms), der Heldenring kommt sanft dazu, Ladeflächen atmen leise in der Deckkraft, das Live-Herz pocht im

/* ---------- Ankommen einer Ansicht: Abschnitte gestaffelt (opacity + 8 px) */
@keyframes mf-auftauchen { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.mf-sicht.mf-neu > * { animation: mf-auftauchen var(--dauer-auftauchen) var(--kurve) both; }
.mf-sicht.mf-neu > :nth-child(2) { animation-delay: 40ms; }
.mf-sicht.mf-neu > :nth-child(3) { animation-delay: 80ms; }
.mf-sicht.mf-neu > :nth-child(4) { animation-delay: 120ms; }
.mf-sicht.mf-neu > :nth-child(5) { animation-delay: 160ms; }
.mf-sicht.mf-neu > :nth-child(n+6) { animation-delay: 200ms; }

/* ---------- Heldenring: kommt mit leichter Vergrößerung, das Leuchten blendet nach */
@keyframes mf-ring-an { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
@keyframes mf-schein-an { from { opacity: 0; } to { opacity: 1; } }
.mf-sicht.mf-neu .rg-bild { animation: mf-ring-an var(--dauer) var(--kurve) both; }
.mf-sicht.mf-neu .rg-schein { animation: mf-schein-an var(--dauer-max) var(--kurve) both; }

/* ---------- Laden: Skelett-Flächen atmen in der Deckkraft (kein Verschieben) */
@keyframes mf-skelett { from { opacity: .45; } to { opacity: .9; } }
.mf-skelett { background: var(--flaeche-2); border: 1px solid var(--haarlinie); animation: mf-skelett var(--dauer-max) var(--kurve) infinite alternate; }
.mf-skelett-ring { width: min(64vw, 240px); aspect-ratio: 1 / 1; margin: 0 auto; border-radius: 50%; background: none; border: 14px solid var(--flaeche-2); }
.mf-skelett-kachel { height: 150px; border-radius: var(--radius-3); }
.mf-laedt .mf-kern { text-align: center; margin: 0 auto; color: var(--grau-5); }

@keyframes lv-schlag { 0% { transform: scale(1); } 14% { transform: scale(1.16); } 28% { transform: scale(1); } 42% { transform: scale(1.08); } 60%, 100% { transform: scale(1); } }
.lv-herz[data-schlaegt] svg { animation: lv-schlag var(--lv-schlag) var(--kurve) infinite; transform-origin: 50% 55%; }

@media (prefers-reduced-motion: reduce) {
  .mf-sicht.mf-neu > *, .mf-sicht.mf-neu .rg-bild, .mf-sicht.mf-neu .rg-schein, .mf-skelett, .lv-herz[data-schlaegt] svg { animation: none !important; opacity: 1; transform: none; }

stlegung MF","erklaerung":"Je Prozentpunkt unter 95 %: 5 Punkte Abzug.","pruefen":true},"erholung.stufe.gruen":{"wert":67,"einheit":"Punkte (ab)","fundstelle":"eigene Festlegung MF (verbreitete Drei-Band-Einteilung in Drittel)","erklaerung":"Ab 67 Punkten: grün – deutlich besser erholt als üblich.","pruefen":true},"erholung.stufe.rot":{"wert":33,"einheit":"Punkte (bis)","fundstelle":"eigene Festlegung MF (verbreitete Drei-Band-Einteilung in Drittel)","erklaerung":"Bis 33 Punkte: rot – weniger erholt als üblich. Dazwischen gelb.","pruefen":true},"puls.max.tanaka":{"wert":{"a_zehntel":2080,"b_zehntel":7},"einheit":"Zehntel Schläge/min | Zehntel Schläge/min je Lebensjahr","fundstelle":"Tanaka H, Monahan KD, Seals DR (2001): Age-predicted maximal heart rate revisited. J Am Coll Cardiol 37(1):153–156","text":"Maximalpuls = 208 − 0,7 × Alter (Schläge pro Minute), auf ganze Schläge gerundet.","erklaerung":"Wenn du deinen Maximalpuls nicht kennst, wird er aus dem Alter geschätzt. Du kannst ihn in den Einstellungen überschreiben.","pruefen":false},"belastung.karvonen":{"wert":null,"einheit":"formel","fundstelle":"Karvonen MJ, Kentala E, Mustala O (1957): The effects of training on heart rate; a longitudinal study. Ann Med Exp Biol Fenn 35(3):307–315","text":"Zonengrenze = Ruhepuls + Prozentsatz × (Maximalpuls − Ruhepuls). Ein Schlag liegt in Zone k, wenn 100 × (Puls − Ruhepuls) ≥ Grenze k × (Maximalpuls − Ruhepuls).","erklaerung":"Die Zonen richten sich nach deinem Pulsspielraum zwischen Ruhe und Maximum – so passen sie zu deinem Körper.","pruefen":false},"belastung.zonen":{"wert":[50,60,70,80,90],"einheit":"Prozent der Herzfrequenzreserve (Untergrenzen Zone 1–5)","fundstelle":"Methode: Karvonen et al. (1957), a. a. O.; 10-%-Stufen: verbreitete Praxiskonvention (Edwards S (1993): The Heart Rate Monitor Book, Fleet Feet Press, Sacramento – dort bezogen auf den Maximalpuls)","erklaerung":"Zone 1 beginnt bei 50 % deines Pulsspielraums, Zone 5 bei 90 %. Darunter zählt nichts zur Belastung.","pruefen":true},"belastung.gewichte":{"wert":[1,2,3,4,5],"einheit":"Faktor je Zone 1–5","fundstelle":"Edwards S (1993): The Heart Rate Monitor Book, Fleet Feet Press, Sacramento (Summated-Heart-Rate-Zone-TRIMP); Prinzip Trainingsimpuls: Banister EW (1991): Modeling elite athletic performance. In: MacDougall JD, Wenger HA, Green HJ (Hg.): Physiological testing of the high-performance athlete, 2. Aufl., Human Kinetics, S. 403–424","text":"Zonen-Minuten = Σ Minuten in Zone k × k.","erklaerung":"Eine Minute in Zone 5 zählt fünfmal so viel wie eine Minute in Zone 1.","pruefen":false},"belastung.luecke_max_ms":{"wert":60000,"einheit":"ms","fundstelle":"eigene Festlegung MF (Messlücken werden höchstens mit 60 Sekunden angerechnet)","text":"Jeder Pulswert gilt bis zum nächsten Messwert, höchstens 60 Sekunden; der letzte Wert einer Reihe zählt 0 Sekunden.","erklaerung":"Fehlen Messwerte, wird nicht geraten: eine Lücke zählt höchstens eine Minute.","pruefen":true},"belastung.skala_max":{"wert":21,"einheit":"Punkte","fundstelle":"eigene Festlegung MF (verbreitete Skala 0–21)","erklaerung":"Die Belastung reicht von 0 (keine) bis 21 (äußerst hoch).","pruefen":true},"belastung.kurve.b":{"wert":25,"einheit":"Zonen-Minuten","fundstelle":"eigene Festlegung MF","erklaerung":"Bestimmt, wie schnell die Kurve am Anfang steigt: 25 Zonen-Minuten ergeben schon gut 4 Punkte.","pruefen":true},"belastung.kurve.tmax":{"wert":700,"einheit":"Zonen-Minuten","fundstelle":"eigene Festlegung MF (etwa drei Stunden harter Ausdauer erreichen das Skalenende)","erklaerung":"Ab 700 Zonen-Minuten ist das Ende der Skala erreicht.","pruefen":true},"belastung":{"wert":null,"einheit":"formel","fundstelle":"eigene Festlegung MF; Zonen nach Karvonen et al. (1957), Gewichtung nach Edwards (1993), Trainingsimpuls nach Banister (1991)","text":"Belastung = {belastung.skala_max} × ln(1 + T ÷ {belastung.kurve.b}) ÷ ln(1 + {belastung.kurve.tmax} ÷ {belastung.kurve.b}), höchstens {belastung.skala_max}, eine Nachkommastelle. T = Zonen-Minuten des Tages (alle Trainings plus Alltag, Alltag ohne Trainingszeit).","erklaerung":"Die Belastung zählt, wie lange und wie hoch dein Puls über den Tag war. Die Kurve steigt anfangs schnell und dann immer flacher: doppelt so viel Anstrengung bringt weniger als doppelt so viele Punkte.","pruefen":true},"schlaf.bedarf.basis":{"wert":28800000,"einheit":"ms","fundstelle":"Hirshkowitz M et al. (2015): National Sleep Foundation's sleep time duration recommendations: methodology and results summary. Sleep Health 1(1):40–43 (Erwachsene 18–64 Jahre: 7–9 Stunden; Mitte 8 Stunden gewählt)","erklaerung":"Grundbedarf 8 Stunden – die Mitte der Empfehlung für Erwachsene. Du kannst ihn in den Einstellungen ändern.","pruefen":false},"schlaf.bedarf.je_belastung":{"wert":60000,"einheit":"ms je Belastungspunkt","fundstelle":"eigene Festlegung MF","erklaerung":"Je Punkt Belastung am Vortag kommt eine Minute Schlafbedarf dazu.","pruefen":true},"schlaf.bedarf.schuld_anteil":{"wert":250,"einheit":"Promille","fundstelle":"eigene Festlegung MF","erklaerung":"Ein Viertel der aufgelaufenen Schlafschuld wird zum Bedarf der nächsten Nacht addiert.","pruefen":true},"schlaf.schuld.fenster":{"wert":7,"einheit":"Tage","fundstelle":"eigene Festlegung MF","text":"Schlafschuld = Summe (Bedarf ohne Schuld − geschlafene Zeit) der letzten 7 Nächte, nicht unter 0.","erklaerung":"Die Schlafschuld zählt, wie viel Schlaf dir in der letzten Woche gefehlt hat. Mehr Schlaf an einem Tag gleicht weniger an einem anderen aus.","pruefen":true},"schlaf.bedarf":{"wert":null,"einheit":"formel","fundstelle":"eigene Festlegung MF; Grundbedarf nach Hirshkowitz et al. (2015)","text":"Schlafbedarf = Grundbedarf + {schlaf.bedarf.je_belastung|min} min je Belastungspunkt des Vortags + {schlaf.bedarf.schuld_anteil|prozent} der Schlafschuld − Nickerchen des Vortags; nicht unter 0.","erklaerung":"Wie viel Schlaf du heute Nacht brauchst: Grundbedarf, etwas mehr nach Anstrengung und nach zu kurzen Nächten, weniger nach einem Nickerchen.","pruefen":true},"schlaf.leistung":{"wert":null,"einheit":"formel","fundstelle":"eigene Festlegung MF (Verhältnis geschlafene Zeit zu Bedarf)","text":"Schlafleistung = geschlafene Zeit (ohne Wachphasen) ÷ Schlafbedarf × 100, höchstens 100, ganze Prozent.","erklaerung":"Wie viel von deinem Schlafbedarf du tatsächlich geschlafen hast.","pruefen":false},"schlaf.effizienz.gut":{"wert":850,"einheit":"Promille","fundstelle":"Ohayon M et al. (2017): National Sleep Foundation's sleep quality recommendations: first report. Sleep Health 3(1):6–19 (Schlafeffizienz ≥ 85 % = gute Schlafqualität)","text":"Schlafeffizienz = geschlafene Zeit ÷ Zeit im Bett (in Promille).","erklaerung":"Welcher Anteil der Zeit im Bett wirklich Schlaf war. Ab 85 % gilt das als gut.","pruefen":false},"schlaf.konsistenz.grenze":{"wert":120,"einheit":"Minuten","fundstelle":"eigene Festlegung MF","text":"Konsistenz = 100 − Abweichung der Einschlafzeit vom Mittel der letzten 7 Nächte (min) × 100 ÷ {schlaf.konsistenz.grenze}, nicht unter 0.","erklaerung":"Wie regelmäßig du ins Bett gehst. Zwei Stunden Abweichung von deiner üblichen Zeit ergeben 0 Punkte.","pruefen":true},"atem.dauer_standard":{"wert":300000,"einheit":"ms","fundstelle":"Balban MY et al. (2023): Brief structured respiration practices enhance mood and reduce physiological arousal. Cell Rep Med 4(1):100895 (5 Minuten täglich)","erklaerung":"Eine Übung dauert ohne eigene Angabe etwa 5 Minuten.","pruefen":false},"atem.box":{"wert":{"phasen":[{"art":"ein","ms":4000},{"art":"halten","ms":4000},{"art":"aus","ms":4000},{"art":"halten2","ms":4000}]},"einheit":"ms je Phase","fundstelle":"Balban MY et al. (2023), a. a. O. (Box Breathing: gleich lange Phasen Einatmen–Halten–Ausatmen–Halten)","erklaerung":"Box-Atmung: 4 Sekunden einatmen, 4 halten, 4 ausatmen, 4 halten – wie die vier Seiten eines Quadrats.","pruefen":false},"atem.vier-sieben-acht":{"wert":{"phasen":[{"art":"ein","ms":4000},{"art":"halten","ms":7000} hase beginnt und endet.","pruefen":false},"tagebuch.min_n":{"wert":5,"einheit":"Tage je Gruppe","fundstelle":"eigene Festlegung MF","erklaerung":"Ein Vergleich wird erst ab 5 Tagen mit und 5 Tagen ohne das Verhalten als aussagekräftig angezeigt.","pruefen":true},"tagebuch.wirkung":{"wert":null,"einheit":"formel","fundstelle":"eigene Festlegung MF (Mittelwertvergleich zweier Gruppen; Zusammenhang, kein Ursachennachweis)","text":"Differenz = mittlere Erholung an Tagen nach einem Tag MIT dem Verhalten − mittlere Erholung an Tagen nach einem Tag OHNE. Tage ohne Eintrag zählen nicht.","erklaerung":"Vergleicht deine Erholung am Morgen danach. Das zeigt einen Zusammenhang, keinen Beweis.","pruefen":false},"trend.band":{"wert":1,"einheit":"Streuungen","fundstelle":"eigene Festlegung MF; angelehnt an Plews et al. (2012), a. a. O. (Normalbereich um den gleitenden Mittelwert)","text":"Band = Mittel der Vortage ± {trend.band} × Streuung.","erklaerung":"Das graue Band zeigt deinen Normalbereich der letzten Tage.","pruefen":true},"vergleich.abstand":{"wert":null,"einheit":"formel","fundstelle":"eigene Festlegung MF (Gegenüberstellung je Tag; JCGM 100:2008 (GUM), Abschnitt 4.2.1 für das arithmetische Mittel)","text":"Abstand = Wert von MAEHR FIT − Wert von WHOOP am selben Tag. Mittlerer Abstand = Mittel der Beträge aller Tage mit beiden Werten; größte Abweichung = größter Betrag.","erklaerung":"Zeigt nur, wie weit beide Zahlen auseinanderliegen. Welche richtig ist, sagt der Abstand nicht.","pruefen":false},"vergleich.nah.erholung":{"wert":100,"einheit":"Zehntel Punkte","fundstelle":"eigene Festlegung MF","text":"Erholung: nah beieinander, wenn |MF − WHOOP| ≤ {vergleich.nah.erholung} Zehntel Punkte.","erklaerung":"Bei der Erholung (0–100) zählt ein Tag bis 10 Punkte Abstand als „nah beieinander“.","pruefen":true},"vergleich.nah.belastung":{"wert":20,"einheit":"Zehntel Punkte","fundstelle":"eigene Festlegung MF","text":"Belastung: nah beieinander, wenn |MF − WHOOP| ≤ {vergleich.nah.belastung} Zehntel Punkte.","erklaerung":"Bei der Belastung (0–21) zählt ein Tag bis 2 Punkte Abstand als „nah beieinander“.","pruefen":true},"vergleich.nah.schlaf":{"wert":100,"einheit":"Zehntel Punkte","fundstelle":"eigene Festlegung MF","text":"Schlafleistung: nah beieinander, wenn |MF − WHOOP| ≤ {vergleich.nah.schlaf} Zehntel Punkte.","erklaerung":"Bei der Schlafleistung (0–100) zählt ein Tag bis 10 Punkte Abstand als „nah beieinander“.","pruefen":true},"vergleich.fremdwert":{"wert":null,"einheit":"fremdwert","fundstelle":"WHOOP-Datenexport, Datei physiological_cycles.csv (Spalten „Recovery score %“, „Day Strain“, „Sleep performance %“)","text":"Fremdwert aus dem WHOOP-Export, Rechenweg nicht bekannt.","erklaerung":"WHOOP rechnet nach eigenem, nicht veröffentlichtem Verfahren. MAEHR FIT übernimmt die Zahl nur zum Vergleich.","pruefen":false},"zusammenfassung":{"wert":null,"einheit":"formel","fundstelle":"JCGM 100:2008 (GUM), Abschnitt 4.2.1 (arithmetisches Mittel); Wochen nach ISO 8601-1:2019","text":"Je Woche (Montag bis Sonntag) bzw. Kalendermonat: Mittelwert, kleinster und größter Wert, Anzahl Tage je Erholungsstufe.","erklaerung":"Fasst Wochen und Monate zusammen, damit du Entwicklungen auf einen Blick siehst.","pruefen":false},"live.rr.min_ms":{"wert":300,"einheit":"ms","fundstelle":"eigene Festlegung MF; angelehnt an Task Force of the ESC and NASPE (1996), a. a. O., Abschnitt „Artefakte und Ektopien“ (unplausible RR-Abstände vor der Auswertung entfernen); 300 ms entspricht 200 Schlägen/min","text":"Ein RR-Abstand unter {live.rr.min_ms} ms (über 200 Schläge pro Minute) gilt als Messfehler und wird verworfen.","erklaerung":"Sehr kurze Abstände zwischen zwei Schlägen sind fast immer Messfehler, keine echten Herzschläge.","pruefen":true},"live.rr.max_ms":{"wert":2000,"einheit":"ms","fundstelle":"eigene Festlegung MF; angelehnt an Task Force of the ESC and NASPE (1996), a. a. O. (unplausible RR-Abstände entfernen); 2000 ms entspricht 30 Schlägen/min","text":"Ei   const vgl = v ? `<p class="mf-vergleich" data-richtung="${esc(v.richtung)}">${pille}<span class="mf-vergleich-text">${esc(v.text)}</span></p>` : "";
  const bild = e.bild ? `<span class="mf-kachel-bild" aria-hidden="true">${e.bild}</span>` : "";
  const html = `<div class="mf-kachel" data-vz="kachel"${e.q ? ` data-tipp data-q="${esc(e.q)}"` : ""}><span class="mf-kachel-titel">${esc(e.titel)}</span><span class="mf-kachel-wert">${zahlHtml}${e.einheit ? `<span class="mf-einheit">${esc(e.einheit)}</span>` : ""}${e.marke ? `<span class="mf-kachel-marke">${esc(e.marke)}</span>` : ""}</span>${bild}${vgl}</div>`;
  return { art: "kachel", svg: "", text, html, ziele: e.q ? [{ i: 0, name: e.titel, q: e.q, quelle: e.quelle || null }] : [] };
}

// ------------------------------------------------------------------ Balken (waagerecht)
function balken(e = {}) {
  const N = normal(e), B = N.breite;
  if (!N.reihen.length) return leer(N, "balken");
  const ZH = 36, LB = Math.min(150, Math.max(64, ...N.reihen.map((r) => breiteVon(r.name) + 12))), WB = Math.min(110, Math.max(48, ...N.reihen.map((r) => breiteVon(r.text, F_ZAHL) + 10)));
  const x0 = LB, x1 = B - WB, hi = Math.max(Number(e.max) || 0, ...N.reihen.map((r) => r.wert), 1);
  const H = N.reihen.length * ZH + 4;
  // Verlauf je Farbe (Zonen): vom hellen Anfang zur vollen Farbe, Füllung als Inline-Stil (schlägt die Klassenfarbe)
  const vId = {}, defs = e.verlauf ? `<defs>${[...new Set(N.reihen.map((r) => r.klasse || "vz-k1"))].map((k) => { vId[k] = neueId("vzb"); return verlaufDef(vId[k], "vz-stopp-" + k.slice(3), "vz-stopp-" + k.slice(3), { x2: 1, y2: 0, deckA: 0.45 }); }).join("")}</defs>` : "";
  const zeilen = N.reihen.map((r, i) => {
    const y = i * ZH + 2, br = Math.max(r.wert > 0 ? 2 : 0, ((x1 - x0) * Math.max(0, r.wert)) / hi);
    const nm = kuerzen(r.name, LB - 12);
    return `<g ${zielAttr(r)}>${tip(r)}<rect class="vz-treffer" x="0" y="${y}" width="${B}" height="${ZH}"/>`
      + `<text class="vz-name" x="${LB - 10}" y="${y + 23}" text-anchor="end">${esc(nm)}</text>`
      + `<rect class="vz-spur" x="${x0}" y="${y + 14}" width="${f1(x1 - x0)}" height="8" rx="4" opacity=".5"/>`
      + `<rect class="vz-marke ${esc(r.klasse || "vz-k1")}" x="${x0}" y="${y + 12}" width="${f1(br)}" height="12" rx="6"${e.verlauf ? ` style="fill:url(#${vId[r.klasse || "vz-k1"]})"` : ""}/>`
      + `<text class="vz-wert" x="${x1 + 8}" y="${y + 23}">${esc(r.text)}</text></g>`;
  }).join("");
  const text = textAlt(N);
  const svg = svgHuelle(N, "balken", H, defs + zeilen, text);
  return { art: "balken", svg, text, html: figur(N, "balken", svg, e.tabelle !== false), ziele: ziele(N) };
}

// ------------------------------------------------------------------ Pulszonen (Balken mit Zonenfarben)
const ZONEN_KLASSE = ["vz-k0", "vz-k1", "vz-k2", "vz-k3", "vz-k4"];
function zonen(e = {}) {
  const reihen = (e.zonen || []).map((z) => ({ name: z.name, wert: Number(z.ms) || 0, text: z.text, q: z.q, quelle: z.quelle, klasse: ZONEN_KLASSE[(Number(z.zone) || 1) - 1] || "vz-k1" }));
  const erg = balken({ verlauf: true, ...e, reihen });
  return { ...erg, art: "zonen", html: erg.html.replace('data-vz="balken"', 'data-vz="zonen"') };
}

// ------------------------------------------------------------------ Zeitreihe mit Band
function zeitreihe(e = {}) {
  const N = normal(e), B = N.breite;
  if (!N.reihen.length) return leer(N, "zeitreihe");
  const OBEN = e.karten ? 40 : 0, H = 190 + OBEN, OB = 16 + OBEN, UN = 150 + OBEN, LI = 12, n = N.reihen.length; // karten: Platz über der Linie für die Hinweiskarte
  const letzterText = N.reihen[n - 1].text, RE = B - Math.max(44, breiteVon(letzterText, F_ZAHL) + 16);
  const w = N.reihen.map((r) => r.wert);
  const bd = e.band && Number.isFinite(Number(e.band.unten)) && Number.isFinite(Number(e.band.oben)) ? { unten: Number(e.band.unten), oben: Number(e.band.oben), text: e.band.text || "" } : null;
  let lo = Math.min(...w, ...(bd ? [bd.unten] : [])), hi = Math.max(...w, ...(bd ? [bd.oben] : []));
  if (e.abNull) lo = Math.min(0, lo);
  if (Number.isFinite(e.min)) lo = Math.min(lo, e.min);
  if (Number.isFinite(e.max)) hi = Math.max(hi, e.max);
  const luft = (hi - lo) * 0.12 || 1; if (!e.abNull) lo -= luft; hi += luft;
  const sp = hi - lo || 1;
  const sx = (i) => (n === 1 ? (LI + RE) / 2 : LI + (i / (n - 1)) * (RE - LI));
  const sy = (v) => UN - ((v - lo) / sp) * (UN - OB);
  const schritt = n > 1 ? (RE - LI) / (n - 1) : RE - LI, maxW = Math.max(...N.reihen.map((r) => breiteVon(r.name)));
  const jede = Math.max(1, Math.ceil((maxW + 10) / schritt));
  const linie = n > 1 ? `<polyline class="vz-linie" points="${w.map((v, i) => `${f1(sx(i))},${f1(sy(v))}`).join(" ")}"/>` : "";
  // Fläche unter der Linie (Verlauf Akzent → durchsichtig), nur mit e.flaeche
  const idF = e.flaeche && n > 1 ? neueId("vzf") : "";
  const flaeche = idF ? `<defs>${verlaufDef(idF, "vz-stopp-flaeche", "vz-stopp-flaeche", { deckA: 0.34, deckB: 0 })}</defs><path class="vz-flaeche" style="fill:url(#${idF})" d="M${f1(sx(0))},${f1(UN)} ${w.map((v, i) => `L${f1(sx(i))},${f1(sy(v))}`).join(" ")} L${f1(sx(n - 1))},${f1(UN)} Z"/>` : "";
  // Hinweiskarte je Punkt (sichtbar bei Zeigen/Fokus, ohne Auswahl die des letzten Punkts – design_viz.css)
  const karte = (r, x, y) => {
    const zeile = `${r.name} · ${r.text}`, bk = Math.max(56, breiteVon(zeile, 0.58) + 20), hk = 28;
    const kx = Math.min(Math.max(x - bk / 2, 0), B - bk), ky = y - hk - 12 < 0 ? y + 12 : y - hk - 12;
    return `<g class="vz-tip" aria-hidden="true"><rect x="${f1(kx)}" y="${f1(ky)}" width="${f1(bk)}" height="${hk}" rx="8"/><text x="${f1(kx + bk / 2)}" y="${f1(ky + 19)}" text-anchor="middle">${esc(zeile)}</text></g>`;
  };
  const punkte = N.reihen.map((r, i) => {
    const x = sx(i), y = sy(w[i]), letzter = i === n - 1;
    const name = (n - 1 - i) % jede === 0 ? (() => { const wn = breiteVon(r.name), nx = Math.min(Math.max(x, wn / 2 + 2), B - wn / 2 - 2); return `<text class="vz-name" x="${f1(nx)}" y="${H - 14}" text-anchor="middle">${esc(r.name)}</text>`; })() : "";
    const wert = letzter ? `<text class="vz-wert" x="${f1(x + 10)}" y="${f1(Math.max(y + 5, 14))}">${esc(r.text)}</text>` : "";
    return `<g ${zielAttr(r)}>${tip(r)}<circle class="vz-treffer" cx="${f1(x)}" cy="${f1(y)}" r="14"/><circle class="vz-punkt${r.klasse ? " " + esc(r.klasse) : ""}" cx="${f1(x)}" cy="${f1(y)}" r="${letzter ? 5 : 4}"/>${wert}${name}${e.karten ? karte(r, x, y) : ""}</g>`;
  }).join("");
  const achse = `<line class="vz-achse" x1="${LI}" x2="${f1(RE)}" y1="${UN + 6}" y2="${UN + 6}"/>`;
  const band = bd ? `<rect class="vz-band" x="${LI}" y="${f1(sy(bd.oben))}" width="${f1(RE - LI)}" height="${f1(Math.max(sy(bd.unten) - sy(bd.oben), 1))}" rx="4"/>` : "";
  const text = textAlt(N, bd?.text || "");
  const svg = svgHuelle(N, "zeitreihe", H, band + flaeche + achse + linie + punkte, text).replace('class="vz-svg vz-zeitreihe"', `class="vz-svg vz-zeitreihe${e.karten ? " vz-mit-karten" : ""}${n > 14 ? " vz-dicht" : ""}"`);
  return { art: "zeitreihe", svg, text, html: figur(N, "zeitreihe", svg), ziele: ziele(N) };
}

// ------------------------------------------------------------------ Segmentbalken (Anteile, z. B. Schlafphasen)
function segmentbalken(e = {}) {
  const N = normal({ ...e, reihen: e.segmente || e.reihen });
  if (!N.reihen.length) return leer(N, "segmentbalken");
  const B = N.breite, H = 18, summe = N.reihen.reduce((s, r) => s + Math.max(0, r.wert), 0) || 1;
  let x = 0;
  const teile = N.reihen.map((r) => {
    const b = (B * Math.max(0, r.wert)) / summe, el = `<g ${zielAttr(r)}>${tip(r)}<rect class="vz-marke ${esc(r.klasse || "vz-k1")}" x="${f1(x)}" y="2" width="${f1(Math.max(b - 2, 0))}" height="${H - 4}" rx="3"/></g>`;
    x += b; return el;
  }).join("");
  const text = textAlt(N);
  const svg = svgHuelle(N, "segment", H, teile, text).replace('class="vz-svg vz-segment"', 'class="vz-svg vz-segment" preserveAspectRatio="none" height="18"');
  const legende = `<ul class="vz-legende">${N.reihen.map((r) => `<li><i class="vz-farbe ${esc(r.klasse || "vz-k1")}" aria-hidden="true"></i><span>${esc(r.name)}</span>${zahlKnopf(r)}</li>`).join("")}</ul>`;
  return { art: "segmentbalken", svg, text, html: figur(N, "segmentbalken", svg + legende, false), ziele: ziele(N) };
}

// ------------------------------------------------------------------ Fortschritt
function fortschritt(e = {}) {
  const w = Math.max(0, Math.min(100, Math.round(Number(e.wert) || 0)));
  const wt = e.text ?? String(w);
  const text = [e.titel, wt].filter(Boolean).join(": ");
  const B = 200, H = 6;
  const fuell = w > 0 ? `<rect class="vz-marke ${esc(e.klasse || "vz-k1")}" x="0" y="0" width="${f1((B * w) / 100)}" height="${H}" rx="3"/>` : "";
  const svg = `<svg class="vz-svg vz-fortschritt" viewBox="0 0 ${B} ${H}" width="100%" height="${H}" preserveAspectRatio="none" role="img" aria-label="${esc(text)}" focusable="false"><title>${esc(e.titel || "")}</title><desc>${esc(text)}</desc><rect class="vz-spur" x="0" y="0" width="${B}" height="${H}" rx="3"/>${fuell}</svg>`;
  return { art: "fortschritt", svg, text, html: `<div class="vz-fortschritt-zeile" data-vz="fortschritt" data-wert="${w}">${svg}${e.ohneWert ? "" : `<span class="vz-f-wert">${esc(wt)}</span>`}</div>`, ziele: [], wert: w };
}

// ------------------------------------------------------------------ Verlauf (Live-Linie über ein festes Zeitfenster)
/**
 * Ruhige Linie über ein festes Zeitfenster (z. B. Puls der letzten 3 Minuten), für Live-Ansichten: ein einziges Ziel statt eines
 * je Punkt, darunter die wichtigen Zahlen als Knöpfe. Die x-Achse ist die Zeit (vonMs … bisMs), nicht die Reihenfolge.
 * Eingabe: { titel, kernaussage, punkte: [{ t, wert }], vonMs, bisMs, q?, text? (letzter Wert), kennzahlen?: [{ name, text, q? }], abNull? }
 */
function verlauf(e = {}) {
  const punkte = (e.punkte || []).filter((p) => p && Number.isFinite(p.t) && Number.isFinite(Number(p.wert))).map((p) => ({ t: p.t, wert: Number(p.wert) }));
  const N = normal({ ...e, reihen: (e.kennzahlen || []).map((k) => ({ ...k, wert: 0 })) });
  if (punkte.length < 2) return leer({ ...N, reihen: [] }, "verlauf");
  const B = N.breite, H = 96, OB = 10, UN = H - 10, LI = 4;
  const letzter = punkte[punkte.length - 1], letzterText = String(e.text ?? letzter.wert), RE = B - Math.max(36, breiteVon(letzterText, F_ZAHL) + 14);
  const von = Number.isFinite(e.vonMs) ? e.vonMs : punkte[0].t, bis = Number.isFinite(e.bisMs) ? e.bisMs : letzter.t, spanne = Math.max(1, bis - von);
  const w = punkte.map((p) => p.wert);
  let lo = Math.min(...w), hi = Math.max(...w);
  if (e.abNull) lo = Math.min(0, lo);
  const luft = (hi - lo) * 0.15 || 5; lo -= e.abNull ? 0 : luft; hi += luft;
  const sx = (t) => LI + (Math.max(0, Math.min(spanne, t - von)) / spanne) * (RE - LI);
  const sy = (v) => UN - ((v - lo) / (hi - lo)) * (UN - OB);
  const linie = `<polyline class="vz-linie" points="${punkte.map((p) => `${f1(sx(p.t))},${f1(sy(p.wert))}`).join(" ")}"/>`;
  const lx = sx(letzter.t), ly = sy(letzter.wert);
  const ende = `<circle class="vz-punkt" cx="${f1(lx)}" cy="${f1(ly)}" r="4"/><text class="vz-wert" x="${f1(lx + 8)}" y="${f1(Math.min(Math.max(ly + 5, 14), H - 2))}">${esc(letzterText)}</text>`;
  const achse = `<line class="vz-achse" x1="${LI}" x2="${f1(RE)}" y1="${UN + 4}" y2="${UN + 4}"/>`;
  const text = [N.titel, N.kernaussage, ...N.reihen.map((r) => `${r.name}: ${r.text}`)].filter(Boolean).map(punktEnde).join(". ") + ".";
  const ziel = { i: 0, name: N.titel || "", text: letzterText, q: e.q || "", quelle: null };
  const inhalt = `<g ${zielAttr(ziel)}>${tip(ziel)}<rect class="vz-treffer" x="0" y="0" width="${B}" height="${H}"/>${achse}${linie}${ende}</g>`;
  const svg = svgHuelle(N, "verlauf", H, inhalt, text);
  const legende = N.reihen.length ? `<ul class="vz-legende">${N.reihen.map((r) => `<li><span>${esc(r.name)}</span>${zahlKnopf(r)}</li>`).join("")}</ul>` : "";
  return { art: "verlauf", svg, text, html: figur({ ...N, reihen: [ziel] }, "verlauf", svg + legende, false), ziele: e.q ? [{ i: 0, name: ziel.name, q: e.q, quelle: null }] : [] };
}

// ------------------------------------------------------------------ Sparkline (Kachel, Held, Trainingszeile)
/**
 * Kleine Linie ohne Achsen. punkte[i].x legt den Platz fest (0…plaetze−1), sonst die Reihenfolge – so bleiben Lücken (Tage ohne
 * Wert) sichtbar. band { unten, oben } = üblicher Bereich als leiser Streifen. alle: jeder Punkt als Punkt in seiner Klasse (Stufe),
 * sonst nur der letzte. linie: false = nur Punkte (Punktreihe). ziele: Punkte sind fokussierbare Ziele mit data-q (Belege).
 * beschriftung: Namen unter den Punkten (z. B. Wochentag). Kein Diagramm mit eigener Frage, sondern ein Bildzeichen: Titel und Satz
 * stehen in der Kachel bzw. im Helden; aria/text trägt die Werte.
 */
function sparkline(e = {}) {
  const pk = (e.punkte || []).map((p, i) => (p && Number.isFinite(Number(p.wert)) ? { ...p, i, x: Number.isFinite(p.x) ? p.x : i, wert: Number(p.wert) } : null)).filter(Boolean);
  const text = e.aria || pk.map((p) => `${p.name ?? ""} ${p.text ?? p.wert}`.trim()).join("; ");
  if (!pk.length) return { art: "sparkline", svg: "", text, html: "", ziele: [] };
  const B = Number(e.breite) || 120, beschr = !!e.beschriftung, HL = beschr ? 18 : 0, H = (Number(e.hoehe) || 32) + HL, R = Number(e.radius) || 3, rand = R + 2;
  const plaetze = Math.max(Number(e.plaetze) || 0, ...pk.map((p) => p.x + 1));
  const bd = e.band && Number.isFinite(Number(e.band.unten)) && Number.isFinite(Number(e.band.oben)) ? { unten: Number(e.band.unten), oben: Number(e.band.oben) } : null;
  let lo = Math.min(...pk.map((p) => p.wert), ...(bd ? [bd.unten] : []), ...(Number.isFinite(e.min) ? [e.min] : []));
  let hi = Math.max(...pk.map((p) => p.wert), ...(bd ? [bd.oben] : []), ...(Number.isFinite(e.max) ? [e.max] : []));
  if (hi - lo < 1e-9) { lo -= 1; hi += 1; }
  const sx = (x) => (plaetze <= 1 ? B / 2 : rand + (x / (plaetze - 1)) * (B - 2 * rand)), sy = (v) => H - HL - rand - ((v - lo) / (hi - lo)) * (H - HL - 2 * rand);
  const band = bd ? `<rect class="vz-band" x="0" y="${f1(sy(bd.oben))}" width="${B}" height="${f1(Math.max(sy(bd.unten) - sy(bd.oben), 1))}" rx="3"/>` : "";
  const pfad = pk.map((p, i) => `${i ? "L" : "M"}${f1(sx(p.x))},${f1(sy(p.wert))}`).join(" ");
  const idF = e.flaeche && pk.length > 1 ? neueId("vzs") : "";
  const flaeche = idF ? `<defs>${verlaufDef(idF, "vz-stopp-flaeche", "vz-stopp-flaeche", { deckA: 0.3, deckB: 0 })}</defs><path class="vz-flaeche" style="fill:url(#${idF})" d="${pfad} L${f1(sx(pk.at(-1).x))},${H - HL} L${f1(sx(pk[0].x))},${H - HL} Z"/>` : "";
  const linie = e.linie !== false && pk.length > 1 ? `<path class="vz-linie vz-spark-linie" d="${pfad}"/>` : "";
  const punkt = (p, letzter) => `<circle class="vz-punkt vz-spark-punkt${p.klasse ? " " + esc(p.klasse) : ""}${letzter ? " vz-letzter" : ""}" cx="${f1(sx(p.x))}" cy="${f1(sy(p.wert))}" r="${letzter ? R + 0.8 : R}"/>`;
  const name = (p) => (beschr && p.name ? `<text class="vz-name vz-spark-name" x="${f1(sx(p.x))}" y="${H - 3}" text-anchor="middle">${esc(p.name)}</text>` : "");
  const zeigen = e.alle ? pk : pk.slice(-1);
  const punkte = e.ziele
    ? pk.map((p, i) => `<g ${zielAttr({ ...p, text: p.text ?? String(p.wert) })}>${tip({ name: p.name ?? "", text: p.text ?? String(p.wert) })}<circle class="vz-treffer" cx="${f1(sx(p.x))}" cy="${f1(sy(p.wert))}" r="${Math.max(12, R + 8)}"/>${e.alle || i === pk.length - 1 ? punkt(p, i === pk.length - 1) : ""}${name(p)}</g>`).join("")
    : zeigen.map((p) => punkt(p, p === pk.at(-1))).join("") + pk.map(name).join("");
  const rolle = e.ziele ? `role="group"` : `role="img"`;
  const svg = `<svg class="vz-svg vz-spark${e.klasse ? " " + esc(e.klasse) : ""}" viewBox="0 0 ${B} ${H}" width="100%" ${rolle} aria-label="${esc(text)}" focusable="false">${band}${flaeche}${linie}${punkte}</svg>`;
  return { art: "sparkline", svg, text, html: `<span class="vz-spark-huelle" data-vz="sparkline">${svg}</span>`, ziele: e.ziele ? pk.map((p) => ({ i: p.i, name: p.name || "", q: p.q || "", quelle: p.quelle || null })) : [] };
}

// ------------------------------------------------------------------ Minibogen (flacher Bogen für Kacheln)
/** Flacher Bogen über 120°: Spur, gefüllter Teil in der Klasse, Endpunkt. anteilBp 0–10.000. */
function minibogen(e = {}) {
  const bp = Math.max(0, Math.min(10000, Math.round(Number(e.anteilBp) || 0)));
  const B = Number(e.breite) || 120, S = 6, rand = S / 2 + 1, halb = 60, R = (B - 2 * rand) / (2 * Math.sin((halb * Math.PI) / 180));
  const H = R * (1 - Math.cos((halb * Math.PI) / 180)) + 2 * rand, cx = B / 2, cy = rand + R;
  const p = (grad) => { const w = (grad * Math.PI) / 180; return [cx + R * Math.sin(w), cy - R * Math.cos(w)]; };
  const bogen = (von, bis) => { const [x0, y0] = p(von), [x1, y1] = p(bis); return `M${f1(x0)},${f1(y0)} A${f1(R)},${f1(R)} 0 0 1 ${f1(x1)},${f1(y1)}`; };
  const ende = -halb + (2 * halb * bp) / 10000, [ex, ey] = p(ende), k = esc(e.klasse || "vz-k1");
  const text = e.aria || "";
  const svg = `<svg class="vz-svg vz-minibogen" viewBox="0 0 ${B} ${f1(H)}" width="100%" role="img" aria-label="${esc(text)}" focusable="false"><path class="vz-mb-spur" d="${bogen(-halb, halb)}" fill="none" stroke-width="${S}" stroke-linecap="round"/>${bp > 0 ? `<path class="vz-mb-wert ${k}" d="${bogen(-halb, ende)}" fill="none" stroke-width="${S}" stroke-linecap="round"/><circle class="vz-mb-kopf ${k}" cx="${f1(ex)}" cy="${f1(ey)}" r="${S / 2 + 1.5}"/>` : ""}</svg>`;
  return { art: "minibogen", svg, text, html: svg, ziele: [], anteilBp: bp };
}

// ------------------------------------------------------------------ Streifen (dünner Segmentbalken für Kacheln)
function streifen(e = {}) {
  const seg = (e.segmente || []).filter((x) => x && Number(x.wert) > 0);
  const B = Number(e.breite) || 120, H = Number(e.hoehe) || 10, summe = seg.reduce((s2, x) => s2 + Number(x.wert), 0) || 1, luft = 2;
  const text = e.aria || seg.map((x) => `${x.name}: ${x.text}`).join("; ");
  let x = 0;

// ------------------------------------------------------------------ Hypnogramm (Schlafphasen über die Nacht)
/**
 * Je Phase ein Band (oben Wach, dann Traum, Leicht, Tief), darin die Abschnitte der Nacht als abgerundete Streifen mit Verlauf;
 * Wachphasen als schmale bernsteinfarbene Marken. Feine Stufenlinien verbinden die Wechsel. Unten die Uhrzeit (volle Stunden).
 * Ein Ziel je Phase (alle Abschnitte dieser Phase, data-q aus summen) – Tippen öffnet den Beleg der Phase. Legende mit Summen.

const HYPNO_REIHE = ["wach", "rem", "leicht", "tief"];
function hypnogramm(e = {}) {
  const summen = (e.summen || []).filter(Boolean);
  const N = normal({ ...e, reihen: summen.map((x) => ({ ...x, wert: 0 })) });
  const phasen = (e.phasen || []).filter((p) => p && Number.isFinite(p.von) && Number.isFinite(p.bis) && p.bis > p.von && HYPNO_REIHE.includes(p.art));

  const LB = Math.min(84, Math.max(...HYPNO_REIHE.map((a) => breiteVon(name(a)) + 10))), RE = B - 4, BH = 34, OB = 4, ACHSE = 26;
  const H = OB + HYPNO_REIHE.length * BH + ACHSE;
  const von = Number.isFinite(e.vonMs) ? e.vonMs : Math.min(...phasen.map((p) => p.von)), bis = Number.isFinite(e.bisMs) ? e.bisMs : Math.max(...phasen.map((p) => p.bis));
  const sx = (ms) => LB + ((Math.max(von, Math.min(bis, ms)) - von) / Math.max(1, bis - von)) * (RE - LB);
  const zeile = (a) => HYPNO_REIHE.indexOf(a), ym = (a) => OB + zeile(a) * BH + BH / 2;
  const ids = Object.fromEntries(HYPNO_REIHE.map((a) => [a, neueId("vzh")]));
  const defs = `<defs>${HYPNO_REIHE.map((a) => verlaufDef(ids[a], "vz-stopp-" + a, "vz-stopp-" + a, { deckA: 1, deckB: 0.62 })).join("")}</defs>`;
  const raster = HYPNO_REIHE.map((a) => `<line class="vz-hyp-raster" x1="${LB}" x2="${RE}" y1="${f1(ym(a))}" y2="${f1(ym(a))}"/>`).join("");
  const sortiert = [...phasen].sort((a, b) => a.von - b.von);
  const stufen = sortiert.slice(1).map((p, i) => { const v = sortiert[i]; return v.art === p.art ? "" : `<line class="vz-hyp-stufe" x1="${f1(sx(p.von))}" x2="${f1(sx(p.von))}" y1="${f1(ym(v.art))}" y2="${f1(ym(p.art))}"/>`; }).join("");
  const baender = HYPNO_REIHE.map((a) => {
    const teile = sortiert.filter((p) => p.art === a);
    if (!teile.length) return "";
    const s = summen.find((x) => x.art === a) || { name: a, text: "" }, r = { i: zeile(a), name: s.name, text: s.text || "", q: s.q };
    const hoehe = a === "wach" ? BH - 10 : 20, y = ym(a) - hoehe / 2;
    const rects = teile.map((p) => { const x0 = sx(p.von), b = Math.max(a === "wach" ? 3 : 2, sx(p.bis) - x0 - 0.5); return `<rect class="vz-hyp vz-hyp-${a}" x="${f1(x0)}" y="${f1(y)}" width="${f1(b)}" height="${hoehe}" rx="${a === "wach" ? 1.5 : f1(Math.min(4, b / 2))}" style="fill:url(#${ids[a]})"/>`; }).join("");
    return `<g ${zielAttr(r)}>${tip(r)}<rect class="vz-treffer" x="0" y="${f1(OB + zeile(a) * BH)}" width="${B}" height="${BH}"/><text class="vz-name vz-hyp-name" x="0" y="${f1(ym(a) + 5)}">${esc(kuerzen(name(a), LB - 10))}</text>${rects}</g>`;
  }).join("");
  // Zeitachse: volle Stunden; Beschriftung nur so dicht, wie Platz ist
  const stunde = 3600000, erste = Math.ceil(von / stunde) * stunde, marken = [];
  for (let m = erste; m <= bis; m += stunde) marken.push(m);
  const zeit = typeof e.zeit === "function" ? e.zeit : (ms) => String(new Date(ms).getHours());
  const proStunde = (RE - LB) / Math.max(1, (bis - von) / stunde), jede = Math.max(1, Math.ceil((breiteVon(zeit(erste), F_ZAHL) + 12) / proStunde));
  const yA = OB + HYPNO_REIHE.length * BH;
  const achse = `<line class="vz-achse" x1="${LB}" x2="${RE}" y1="${yA + 2}" y2="${yA + 2}"/>` + marken.map((m, i) => {
    const x = sx(m), wn = breiteVon(zeit(m), F_ZAHL), tx = Math.min(Math.max(x, LB + wn / 2), RE - wn / 2);
    return `<line class="vz-achse" x1="${f1(x)}" x2="${f1(x)}" y1="${yA + 2}" y2="${yA + 6}"/>${i % jede === 0 ? `<text class="vz-name vz-achsen-text" x="${f1(tx)}" y="${yA + 21}" text-anchor="middle">${esc(zeit(m))}</text>` : ""}`;
  }).join("");
  const text = textAlt(N);
  const svg = svgHuelle(N, "hypnogramm", H, defs + raster + stufen + baender + achse, text);
  const legende = `<ul class="vz-legende vz-legende-zwei">${N.reihen.map((r) => `<li><i class="vz-farbe vz-farbe-${esc(r.art)}" aria-hidden="true"></i><span>${esc(r.kurz || r.name)}</span>${zahlKnopf(r)}</li>`).join("")}</ul>`;
  return { art: "hypnogramm", svg, text, html: figur(N, "hypnogramm", svg + legende, false), ziele: ziele(N) };
}

// ------------------------------------------------------------------ Bedarf gegen geschlafene Zeit (Doppelbalken mit Schuld)
function bedarfBalken(e = {}) {
  const b = e.bedarf, s = e.ist, sch = e.schuld && Number(e.schuld.wert) > 0 ? e.schuld : null;
  const reihen = [b, s, sch].filter(Boolean);
  const N = normal({ ...e, reihen });

  const B = N.breite, hi = Math.max(Number(b.wert) || 0, Number(s.wert) || 0, 1), skala = (v) => (B * Math.max(0, Number(v) || 0)) / hi;

  const kopf = (r, y) => `<text class="vz-name" x="0" y="${y + 14}">${esc(r.name)}</text><text class="vz-wert" x="${B}" y="${y + 14}" text-anchor="end">${esc(r.text)}</text>`;
  const zeileB = `<g ${zielAttr({ ...N.reihen[0] })}>${tip(N.reihen[0])}<rect class="vz-treffer" x="0" y="0" width="${B}" height="${ZH}"/>${kopf(b, 0)}<rect class="vz-bedarf" x="0" y="24" width="${f1(skala(b.wert))}" height="${BH}" rx="${BH / 2}"/></g>`;
  const zeileS = `<g ${zielAttr({ ...N.reihen[1] })}>${tip(N.reihen[1])}<rect class="vz-treffer" x="0" y="${ZH}" width="${B}" height="${ZH}"/>${kopf(s, ZH)}<rect class="vz-bedarf-spur" x="0" y="${ZH + 24}" width="${f1(Math.max(skala(b.wert), skala(s.wert)))}" height="${BH}" rx="${BH / 2}"/><rect class="vz-ist" x="0" y="${ZH + 24}" width="${f1(skala(s.wert))}" height="${BH}" rx="${BH / 2}" style="fill:url(#${idV})"/></g>`;
  const zeileSch = sch ? `<g ${zielAttr({ ...N.reihen[2] })}>${tip(N.reihen[2])}<rect class="vz-schuld" x="${f1(skala(s.wert) + 3)}" y="${ZH + 24}" width="${f1(Math.max(skala(b.wert) - skala(s.wert) - 3, 2))}" height="${BH}" rx="${BH / 2}" style="fill:url(#${idS})"/></g>` : "";
  const text = textAlt(N);
  const svg = svgHuelle(N, "bedarfbalken", 2 * ZH, defs + zeileB + zeileS + zeileSch, text);
  const legende = sch ? `<ul class="vz-legende vz-legende-zwei"><li><i class="vz-farbe vz-farbe-schuld" aria-hidden="true"></i><span>${esc(sch.name)}</span>${zahlKnopf(N.reihen[2])}</li></ul>` : "";
  return { art: "bedarf", svg, text, html: figur(N, "bedarf", svg + legende), ziele: ziele(N) };
}

// ------------------------------------------------------------------ Tastatur (nur im Browser)
function vizTastatur(wurzel = typeof document !== "undefined" ? document : null) {
  if (!wurzel || wurzel._vzTastatur) return;
  wurzel._vzTastatur = true;

return { RING_STRICH, ring, kennzahlKachel, balken, zonen, zeitreihe, segmentbalken, fortschritt, verlauf, sparkline, minibogen, streifen, HYPNO_REIHE, hypnogramm, bedarfBalken, vizTastatur };

// ===== shell/speicher_browser.js
const __m_shell_speicher_browser_js = (() => {
/* shell/speicher_browser.js – Speicher-Schnittstelle des Kerns (docs/technik/schnittstellen.md) im Browser.
 *
 * Kernaussage: Alles, was MAEHR FIT sich merkt (Tagebuch, Einstellungen, eingelesene Messwerte), liegt nur in diesem Browser bzw.
 * dieser App: zuerst in IndexedDB, wenn das nicht geht (privates Fenster, alte WebView) in localStorage, und notfalls nur im
 * Arbeitsspeicher, solange die Seite offen ist. Nichts geht ins Netz.
 *
 * Schnittstelle (Vertrag): { lies(schluessel) → Promise<any>, schreib(schluessel, wert) → Promise<void>, liste(praefix) → Promise<String[]> }
 * Zusätzlich: loesche(schluessel), loescheAlles() → Promise<void>, art ("indexeddb" | "localstorage" | "speicher")
 * schreib(schluessel, undefined) und schreib(schluessel, null) entfernen den Eintrag.
 */
const DB = "maehr-fit", ABLAGE = "werte", PRAEFIX = "mf.";
const weg = (w) => w === undefined || w === null;
/** loesche(k) für alle Formen: schreib(k, undefined) */
const mitLoesche = (s) => ({ ...s, loesche: (k) => s.schreib(k, undefined) });

function ausIndexedDb(idb) {
  const offen = new Promise((ok, fehler) => {
    const r = idb.open(DB, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(ABLAGE);
    r.onsuccess = () => ok(r.result);
    r.onerror = () => fehler(r.error);
  });
  const tx = async (modus, arbeit) => {
    const db = await offen;
    return new Promise((ok, fehler) => {
      const t = db.transaction(ABLAGE, modus), s = t.objectStore(ABLAGE);
      const r = arbeit(s);
      t.oncomplete = () => ok(r?.result);
      t.onerror = () => fehler(t.error);
      t.onabort = () => fehler(t.error);
    });
  };
  return {
    art: "indexeddb", bereit: offen.then(() => true),
    lies: (k) => tx("readonly", (s) => s.get(k)),
    schreib: async (k, w) => { await tx("readwrite", (s) => (weg(w) ? s.delete(k) : s.put(w, k))); },
    liste: async (p = "") => ((await tx("readonly", (s) => s.getAllKeys())) || []).map(String).filter((k) => k.startsWith(p)).sort(),
    loescheAlles: async () => { await tx("readwrite", (s) => s.clear()); },
  };
}

function ausLocalStorage(ls) {
  return {
    art: "localstorage", bereit: Promise.resolve(true),
    lies: async (k) => { const v = ls.getItem(PRAEFIX + k); return v === null ? undefined : JSON.parse(v); },
    schreib: async (k, w) => { if (weg(w)) ls.removeItem(PRAEFIX + k); else ls.setItem(PRAEFIX + k, JSON.stringify(w)); },
    liste: async (p = "") => Object.keys(ls).filter((k) => k.startsWith(PRAEFIX + p)).map((k) => k.slice(PRAEFIX.length)).sort(),
    loescheAlles: async () => { for (const k of Object.keys(ls)) if (k.startsWith(PRAEFIX)) ls.removeItem(k); },
  };
}

function ausMap(m = new Map()) {
  return mitLoesche({
    art: "speicher", bereit: Promise.resolve(true),
    lies: async (k) => (m.has(k) ? structuredClone(m.get(k)) : undefined),
    schreib: async (k, w) => { if (weg(w)) m.delete(k); else m.set(k, structuredClone(w)); },
    liste: async (p = "") => [...m.keys()].filter((k) => k.startsWith(p)).sort(),
    loescheAlles: async () => m.clear(),
  });
}

/** Bester verfügbarer Speicher; prüft IndexedDB mit einem Probelauf und fällt sonst zurück. */
async function speicherBrowser(g = globalThis) {
  try {
    if (g.indexedDB) { const s = ausIndexedDb(g.indexedDB); await s.bereit; await s.liste(""); return mitLoesche(s); }
  } catch { /* weiter mit localStorage */ }
  try {
    if (g.localStorage) { g.localStorage.setItem(PRAEFIX + "probe", "1"); g.localStorage.removeItem(PRAEFIX + "probe"); return mitLoesche(ausLocalStorage(g.localStorage)); }
  } catch { /* weiter im Arbeitsspeicher */ }
  return mitLoesche(ausMap());
}
return { ausMap, speicherBrowser };
})();

// ===== shell/speicher_server.js
const __m_shell_speicher_server_js = (() => {
/* shell/speicher_server.js – Speicher-Schnittstelle des Kerns (kern/speicher.js) über den Dienst am Rechner (desktop/mf_dienst.py).
 *
 * Kernaussage: Öffnest du MAEHR FIT am Rechner über das kleine Programm dort, liegen deine Werte nicht im Browser, sondern in der
 * Datenbank des Programms (~/.maehrfit/mf.sqlite) – dort, wo auch die Werte vom Handy und aus dem Eingangsordner ankommen.
 * Diese Datei merkt das selbst: Antwortet der Dienst, spricht sie mit ihm; sonst nimmt sie wie bisher den Speicher des Browsers.
 *
 * Erkennung: Seite über http(s) geladen, der Dienst hat beim Ausliefern seinen Sitzungsschlüssel als <meta name="mf-dienst"> eingesetzt,
 *   und GET /api/status antwortet mit app "maehr-fit-dienst" und lokal: true. Sonst: speicherBrowser() (IndexedDB …).
 * Schnittstelle (Vertrag wie speicher_browser.js): { lies, schreib, liste, loesche, loescheAlles, art: "rechner", bereit }
 *   Zusätzlich: dienstAnfrage(pfad, init) für die Sync-Ansicht (Geräte, Koppeln, Eingangsordner).
 * Schneller Start: liste(praefix) holt alle Werte des Präfixes in einem Zug (GET /api/speicher/alle) und merkt sie sich kurz;
 *   die folgenden lies() kommen aus diesem Zwischenspeicher. schreib() hält ihn aktuell.
 */
const { speicherBrowser } = __m_shell_speicher_browser_js;

const FRISCH_MS = 3000;
const weg = (w) => w === undefined || w === null;

/** Sitzungsschlüssel aus der vom Dienst ausgelieferten Seite, sonst null. */
function dienstToken(g = globalThis) {
  const proto = g.location?.protocol || "";
  if (!/^https?:$/.test(proto)) return null;
  const meta = g.document?.querySelector?.('meta[name="mf-dienst"]');
  const token = meta?.getAttribute?.("content");
  return token && token.length >= 16 ? token : null;
}

/** Speicher über den Dienst (ohne Prüfung, ob er antwortet – das macht speicherServer). */
function ausDienst({ token, fetch: f = globalThis.fetch?.bind(globalThis), jetzt = () => Date.now() }) {
  const anfrage = async (pfad, init = {}) => {
    const r = await f(pfad, { ...init, headers: { "X-MF-Lokal": token, ...(init.body !== undefined ? { "Content-Type": "application/json" } : {}), ...(init.headers || {}) } });
    let obj = null;
    try { obj = await r.json(); } catch { obj = null; }
    if (!r.ok) throw new Error(obj?.text || `Dienst am Rechner: Fehler ${r.status}`);
    return obj;
  };
  const zwischen = new Map();           // schluessel → { wert, zeit }
  const merke = (k, w) => zwischen.set(k, { wert: w, zeit: jetzt() });
  const kopie = (w) => (w === undefined ? undefined : structuredClone(w));
  const s = {
    art: "rechner", bereit: Promise.resolve(true), dienstAnfrage: anfrage,
    async lies(k) {
      const z = zwischen.get(k);
      if (z && jetzt() - z.zeit < FRISCH_MS) return kopie(z.wert);
      const r = await anfrage(`/api/speicher/wert?k=${encodeURIComponent(k)}`);
      const w = r.da ? r.wert : undefined;
      merke(k, w);
      return kopie(w);
    },
    async schreib(k, w) {
      await anfrage(`/api/speicher/wert?k=${encodeURIComponent(k)}`, { method: "PUT", body: JSON.stringify(weg(w) ? null : w) });
      merke(k, weg(w) ? undefined : structuredClone(w));
    },
    async liste(p = "") {
      const r = await anfrage(`/api/speicher/alle?praefix=${encodeURIComponent(p)}`);
      for (const [k, w] of Object.entries(r.werte || {})) merke(k, w);
      return Object.keys(r.werte || {}).sort();
    },
    async loescheAlles() { await anfrage("/api/speicher/alles", { method: "DELETE" }); zwischen.clear(); },
  };
  s.loesche = (k) => s.schreib(k, undefined);
  return s;
}

/**
 * Bester Speicher: der Dienst am Rechner, wenn er antwortet, sonst der Browser-Speicher.
 * @param {{ g?: object, fetch?: Function, rueckfall?: () => Promise<object> }} [optionen]
 */
async function speicherServer({ g = globalThis, fetch: f = g.fetch?.bind(g), rueckfall = () => speicherBrowser(g) } = {}) {
  const token = dienstToken(g);
  if (token && typeof f === "function") {
    try {
      const r = await f("/api/status", { headers: { "X-MF-Lokal": token } });
      const s = r.ok ? await r.json() : null;
      if (s?.app === "maehr-fit-dienst" && s.lokal === true) return ausDienst({ token, fetch: f });
    } catch { /* Dienst nicht erreichbar: Browser-Speicher */ }
  }
  return rueckfall();
}
return { dienstToken, ausDienst, speicherServer };
})();

// ===== shell/bewegung.js
const __m_shell_bewegung_js = (() => {
/* shell/bewegung.js – die wenigen Bewegungen von MAEHR FIT im Browser (Ankommen einer Ansicht, Hochzählen der Heldenzahl).
 *
 * Kernaussage: Wenn du eine Ansicht öffnest, erscheinen ihre Abschnitte kurz nacheinander (Deckkraft und 8 px nach oben, 200 ms,
 * gestaffelt – CSS in design_bewegung.css), und die große Zahl zählt in höchstens 450 ms auf ihren Wert hoch. Wer am Gerät
 * „weniger Bewegung“ eingestellt hat, sieht sofort alles an seinem Platz. Beim Zurückkehren zu einem Reiter steht die Seite wieder
 * dort, wo du warst.
 *
 * Schnittstelle: ankommen(haupt, { neu }) · hochzaehlen(el, ziel, stellen, sprache) · weniger() · scrollMerken(weg) · scrollZurueck(weg)
 * Takt: requestAnimationFrame gegen performance.now(), kein Intervall-Zeitgeber.
 */
const DAUER_HOCHZAEHLEN_MS = 450;
const weniger = () => typeof matchMedia === "function" && matchMedia("(prefers-reduced-motion: reduce)").matches;

/** Zahl im Gebietsschema der Seite hochzählen (ease-out), am Ende exakt der Zielwert. */
function hochzaehlen(el, ziel, stellen = 0, locale = document.documentElement.lang || "de") {
  if (!el || !Number.isFinite(ziel)) return;
  const fmt = new Intl.NumberFormat(locale === "en" ? "en-GB" : "de-DE", { minimumFractionDigits: stellen, maximumFractionDigits: stellen });
  const end = el.textContent;
  if (weniger()) return;
  const start = performance.now();
  const schritt = (jetzt) => {
    if (!el.isConnected) return;
    const f = Math.min(1, (jetzt - start) / DAUER_HOCHZAEHLEN_MS), e = 1 - (1 - f) ** 3;
    el.textContent = f < 1 ? fmt.format(ziel * e) : end;
    if (f < 1) requestAnimationFrame(schritt);
  };
  requestAnimationFrame(schritt);
}

/** Nach dem Zeichnen: bei neuer Ansicht gestaffelt einblenden und die Heldenzahl hochzählen. */
function ankommen(haupt, { neu = false } = {}) {
  const sicht = haupt?.querySelector(".mf-sicht");
  if (!sicht || !neu) return;
  sicht.classList.add("mf-neu");
  for (const el of sicht.querySelectorAll("[data-hochzaehlen]")) hochzaehlen(el, Number(el.dataset.hochzaehlen), Number(el.dataset.stellen) || 0);
}

const SCROLL = new Map();
const scrollMerken = (weg) => { if (weg) SCROLL.set(weg, window.scrollY); };
const scrollZurueck = (weg) => window.scrollTo(0, SCROLL.get(weg) || 0);
return { DAUER_HOCHZAEHLEN_MS, weniger, hochzaehlen, ankommen, scrollMerken, scrollZurueck };
})();

// ===== daten/zeit.js
const __m_daten_zeit_js = (() => {
// Zeit-Hilfen der Datenschicht: Zeitangaben aus Health Connect und WHOOP-CSV in Unix-Millisekunden
// umrechnen und den Kalendertag (JJJJ-MM-TT) eines Zeitpunkts bestimmen.
// Rein: kein DOM, kein Netz, kein Speicher. Nur Intl für IANA-Zonen (z. B. "Europe/Berlin").

const MS_MINUTE = 60000;

/** Zahl mit führender Null (2 Stellen). */
function zwei(n) {
  return String(n).padStart(2, "0");

/**
 * Kalendertag eines Zeitpunkts.
 * @param {number} t Unix-Millisekunden
 * @param {number|null|undefined} zoneMin Abstand zur UTC in Minuten (z. B. +60 für MEZ). Fehlt er, gilt die Gerätezeitzone.
 * @returns {string} "JJJJ-MM-TT"

    const d = new Date(t + zoneMin * MS_MINUTE);

 */
function zuordnen(typ, roh, zusatz = {}) {
  const paket = leeresPaket();
  const liste = Array.isArray(roh) ? roh : [];
  switch (typ) {
    case "HeartRate": paket.herzschlag = herzschlaegeAus(liste); break;
    case "HeartRateVariabilityRmssd": paket.hrv = punktwerte(liste, typ, "heartRateVariabilityMillis", "rmssdMs"); break;
    case "RestingHeartRate": paket.ruhepuls = punktwerte(liste, typ, "beatsPerMinute", "bpm"); break;
    case "RespiratoryRate": paket.atemfrequenz = punktwerte(liste, typ, "rate", "proMin"); break;
    case "OxygenSaturation": paket.spo2 = punktwerte(liste, typ, "percentage", "prozent"); break;
    case "SkinTemperature": paket.hauttemp = hauttempAus(liste); break;
    case "SleepSession": paket.schlaf = schlafAus(liste); break;
    case "ExerciseSession": paket.training = trainingAus(liste, zusatz.herzschlaege || []); break;
    default: throw new Error(`Unbekannte Health-Connect-Datenart: ${typ}`);
  }
  return paket;
}

/** Brücke aus `ziel.MF.native.healthConnect` holen, oder null. */
function findeBruecke(ziel = globalThis) {
  const b = ziel && ziel.MF && ziel.MF.native && ziel.MF.native.healthConnect;
  return b && typeof b.lesen === "function" ? b : null;
}

/** Ist Health Connect nutzbar? → { verfuegbar, grund } (grund: "kein_android" | Status der Brücke). */
async function verfuegbar(bruecke) {
  if (!bruecke) return { verfuegbar: false, grund: "kein_android" };
  try {
    const r = await bruecke.verfuegbar();
    if (typeof r === "boolean") return { verfuegbar: r, grund: r ? "verfuegbar" : "nicht_verfuegbar" };
    return { verfuegbar: !!(r && r.verfuegbar), grund: (r && r.status) || "unbekannt", ...r };
  } catch (e) {
    return { verfuegbar: false, grund: "fehler", fehler: String(e && e.message ? e.message : e) };
  }
}

/** Leserechte anfragen → { erteilt: string[], fehlend: string[] }. */
async function berechtigungen(bruecke, arten = RECORD_TYPEN, zeitgrenzeMs = VORGABEN.rechteZeitgrenzeMs) {
  if (!bruecke) return { erteilt: [], fehlend: [...arten] };
  const r = (await mitZeitgrenze(Promise.resolve(bruecke.berechtigungen(arten)), zeitgrenzeMs,
    "Health Connect hat auf die Rechte-Abfrage nicht geantwortet. Öffne Health Connect → App-Berechtigungen → MAEHR FIT und gib die Lese-Rechte frei; dann erneut „Verbinden“.")) || {};
  const erteilt = Array.isArray(r.erteilt) ? r.erteilt : [];
  return { erteilt, fehlend: arten.filter((a) => !erteilt.includes(a)) };
}

const text = (fehler) => String(fehler && fehler.message ? fehler.message : fehler);

/**
 * Inkrementeller Abgleich: je Datenart ab dem letzten Stand (minus Überlappung) bis jetzt lesen, in Tagesfenstern
 * (damit die Brücke nie zu große Antworten liefern muss), zuordnen, ablegen und nach jedem Fenster den Stand merken
 * ("sync:healthconnect:<Datenart>" → { bisMs, zeitpunktMs, anzahl gelesen in diesem Lauf }).
 *
 * Scheitert ein Fenster (Zeitüberschreitung, zu große Antwort, Quote von Health Connect), wird es halbiert und noch einmal
 * versucht; ein kleinstes Fenster, das auch nach Wiederholung scheitert, wird als Lücke gemeldet und übersprungen.
 * Der Stand bleibt dann am Beginn der ersten Lücke, der nächste Lauf liest sie wieder. Drei Lücken hintereinander (oder ein
 * endgültiger Fehler wie fehlendes Recht) beenden diese Art für diesen Lauf; die anderen Arten laufen weiter.
 * Nichts wird verschluckt: `arten[typ].fehler` und `arten[typ].luecken` nennen jeden Fehler, oben stehen `fehler` (Texte),
 * `zaehlung` (gelesene Datensätze je MF-Art), `zeitraum` (erster/letzter Kalendertag) und `luecken`.
 * `herkunft` nennt je MF-Art die schreibenden Apps (Paketname) mit Anzahl, `schlafPhasen` die Nächte mit/ohne echte Schlafstufen.
 * `paket` im Ergebnis enthält nur die neu hinzugekommenen Datensätze.
 * @param {{bruecke:object, speicher:object, jetzt?:number, arten?:string[], vorgaben?:object,
 *   fortschritt?:(info:{typ:string, art:string, nr:number, von:number, gelesen:number, phase:string})=>void}} p
 */
async function synchronisieren({ bruecke, speicher, jetzt = Date.now(), arten = RECORD_TYPEN, vorgaben = {}, fortschritt }) {
  if (!bruecke) throw new Error("Health Connect ist nur in der Android-App verfügbar.");
  const v = { ...VORGABEN, ...vorgaben };
  const warte = v.warte || ((ms) => new Promise((ok) => setTimeout(ok, ms)));
  const ergebnis = {
    arten: {}, neu: 0, ersetzt: 0, paket: leeresPaket(), zaehlung: {}, zeitraum: null, luecken: [], fehler: [],
    herkunft: {}, // gelesene Datensätze je MF-Art und App: { hrv: { "com.whoop.android": 12 } } (je quelle.id einmal gezählt)
    schlafPhasen: { mit: 0, ohne: 0 }, // gelesene Nächte mit/ohne echte Schlafstufen (leer → Schlafansicht zeigt 0 Minuten je Phase)
  };
  const meldung = (info) => { try { fortschritt?.(info); } catch { /* Anzeige darf den Abgleich nie stören */ } };
  const reihenfolge = RECORD_TYPEN.filter((t) => arten.includes(t));
  for (const typ of reihenfolge) {
    const stand = await speicher.lies(SYNC_PRAEFIX + typ);
    const von = stand && typeof stand.bisMs === "number" ? stand.bisMs - v.ueberlappungMs : jetzt - v.ersterZeitraumMs;
    const bericht = { vonMs: von, bisMs: von, gelesen: 0, neu: 0, ersetzt: 0, luecken: [] };
    ergebnis.arten[typ] = bericht;
    const mfArt = ART_ZU_PAKET[typ];
    const nrGesamt = Math.max(1, Math.ceil((jetzt - von) / v.fensterMs));
    let ersteLuecke = null, serie = 0, nr = 0;
    const gezaehlt = new Set();
    /** Herkunft (App) und Schlafstufen der gelesenen Datensätze vermerken; Überlappung der Fenster zählt nicht doppelt. */
    const vermerke = (paket) => {
      for (const d of paket[mfArt]) {
        const id = d.quelle && d.quelle.id;
        if (gezaehlt.has(id)) continue;
        gezaehlt.add(id);
        const app = (d.quelle && d.quelle.herkunft) || "unbekannt";
        const h = (ergebnis.herkunft[mfArt] = ergebnis.herkunft[mfArt] || {});
        h[app] = (h[app] || 0) + 1;
        if (mfArt === "schlaf") ergebnis.schlafPhasen[hatSchlafphasen(d) ? "mit" : "ohne"] += 1;
      }
    };

    /** Ein Fenster lesen; true = gelesen und abgelegt, false = Lücke. Wirft nur bei endgültigem Fehler oder Ablagefehler. */
    const fenster = async (a, e) => {
      let roh = null, letzterFehler = null;
      for (let versuch = 0; versuch <= v.wiederholungen && roh === null; versuch++) {
        try {
          roh = (await mitZeitgrenze(Promise.resolve(bruecke.lesen(typ, a, e)), v.lesenZeitgrenzeMs,
            `Health Connect hat beim Lesen von ${typ} nicht geantwortet (Zeitgrenze ${Math.round(v.lesenZeitgrenzeMs / 1000)} s).`)) || [];
        } catch (fehler) {
          letzterFehler = fehler;
          if (endgueltig(fehler)) throw fehler;
          if (e - a > v.kleinsterFensterMs) {
            // Fenster halbieren: kleinere Antworten, und die Lücke bleibt so klein wie möglich
            const mitte = a + Math.floor((e - a) / 2);
            const links = await fenster(a, mitte);
            const rechts = await fenster(mitte, e);
            return links && rechts;
          }
          if (versuch < v.wiederholungen) await warte(v.wartenMs);
        }
      }
      if (roh === null) {
        bericht.luecken.push({ vonMs: a, bisMs: e, fehler: text(letzterFehler) });
        ergebnis.luecken.push({ typ, vonMs: a, bisMs: e, fehler: text(letzterFehler) });
        if (ersteLuecke === null) ersteLuecke = a;
        bericht.fehler = bericht.fehler || text(letzterFehler);
        return false;
      }
      const paket = zuordnen(typ, roh, typ === "ExerciseSession" ? await herzschlaegeFuer(bruecke, roh) : {});

        if (bericht.bisTag === undefined || tag > bericht.bisTag) bericht.bisTag = tag;
